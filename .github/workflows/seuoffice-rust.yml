name: seuoffice rust
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable isolated PDF codec source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pdf-codec-proof-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  pdf-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate immutable source
        shell: bash
        run: |
          printf 'PROOF_DIR=%s/pdf-codec-proof\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os
          assert os.environ['SOURCE_SHA'] == '3c9411d4d11cfbda8e810005b416847338bed17e'
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.100.0'
      - name: Record exact identities and input hashes
        shell: bash
        run: |
          mkdir -p "$PROOF_DIR"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          assert sys.version_info >= (3, 11)
          root = pathlib.Path('source')
          actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['SOURCE_SHA']
          inventory = json.loads((root / 'tools/pdf-native-proof/source-snapshot.json').read_text())
          for name, expected in inventory['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          identity = {
              'scope': 'isolated-native-pdf-codec-synthetic-keys-only',
              'definitionSha': subprocess.check_output(['git', '-C', 'definition', 'rev-parse', 'HEAD'], text=True).strip(),
              'sourceSha': actual, 'runId': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'snapshotSha256': hashlib.sha256((root / 'tools/pdf-native-proof/source-snapshot.json').read_bytes()).hexdigest(),
              'wholeApplicationVerified': False, 'systemTrustParity': False,
          }
          pathlib.Path(os.environ['PROOF_DIR'], 'identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
      - name: Install exact source dependencies
        working-directory: source
        run: npm ci
      - name: Build actual codec and compare synthetic signing
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          python3 -B tools/pdf-native-proof/run.py --scratch "$PROOF_DIR" 2>&1 | tee "$PROOF_DIR/validation.log"
      - name: Preserve proof evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-pdf-codec-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_DIR }}
          if-no-files-found: error
          retention-days: 7
