name: seuoffice rust - final ten core sensitivity

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit bounded ten original final-miss retained sensitivity mode
        required: true
        type: choice
        options:
          - final-core-retained-sensitivity
      product_sha:
        description: Exact 3e5a4b02 validation product, not a branch or a legacy gate
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: seuoffice-final-core-retained-sensitivity-${{ inputs.product_sha || github.ref }}
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode }}
  PRODUCT_DIR: ${{ github.workspace }}/product
  DRIVER_DIR: ${{ github.workspace }}/driver
  PRODUCT_SHA: ${{ inputs.product_sha }}
  DEFINITION_SHA: ${{ github.sha }}
  PLAN_PATH: ${{ github.workspace }}/final-core-plan.json
  PREREQUISITE_PATH: ${{ github.workspace }}/prerequisite.json

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      product_sha: ${{ steps.identity.outputs.product_sha }}
      matrix: ${{ steps.identity.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the exact three-lane prerequisite and bounded request
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node driver/tools/main-diff/final-core-sensitivity.mjs validate
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.product_sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Bind source lineage and original mutation objects
        run: node driver/tools/main-diff/final-core-sensitivity.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: final-core-plan
          path: |
            final-core-plan.json
            prerequisite.json
          if-no-files-found: error

  sensitivity:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      JOB_KEY: ${{ matrix.key }}
      JOB_OUT: ${{ github.workspace }}/job-out/${{ matrix.key }}
      MAIN_DIFF_MUTATION_EVIDENCE_DIR: ${{ github.workspace }}/job-out/${{ matrix.key }}/retained
      MAIN_DIFF_ADDON: ${{ github.workspace }}/job-out/${{ matrix.key }}/main_node.node
      MAIN_DIFF_PROFILE: node-faults
      SEUOFFICE_WASM: ${{ github.workspace }}/product/crates/target/wasm32-wasip1/release/office_wasm.wasm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.product_sha }}
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: final-core-plan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the exact source and frozen job plan
        run: node driver/tools/main-diff/final-core-sensitivity.mjs check
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/crates
          key: final-core-${{ inputs.product_sha }}
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: product/crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('product/vendor/rhwp-core/**', 'product/tools/build-rhwp-core.mjs') }}
      - name: Product rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        working-directory: product
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Install exact product dependencies
        working-directory: product
        run: npm ci
      - name: Build exact product WASM
        working-directory: product
        run: npm run build:wasm
      - name: Normal selected consumer baseline
        env:
          CARGO_INCREMENTAL: '1'
        run: node driver/tools/main-diff/final-core-sensitivity.mjs baseline
      - name: Original control and target with append-only evidence
        id: mutations
        working-directory: product
        env:
          CARGO_INCREMENTAL: '1'
          FAULT_SHARD: ${{ matrix.shard }}
          FAULT_CATALOG: ${{ matrix.catalog }}
        shell: bash
        run: node tools/main-diff/faults.mjs "$FAULT_CATALOG" 2>&1 | tee "$JOB_OUT/faults.txt"
      - name: Preserve the original producer result
        if: always()
        shell: bash
        run: |
          mkdir -p "$JOB_OUT"
          if [ -f product/tools/main-diff/out/faults.json ]; then
            cp product/tools/main-diff/out/faults.json "$JOB_OUT/faults.json"
          fi
      - name: Audit every retained record, typed witness and source restoration
        if: ${{ success() }}
        env:
          CARGO_INCREMENTAL: '1'
          MUTATION_STATUS: ${{ steps.mutations.outcome }}
        run: node driver/tools/main-diff/final-core-sensitivity.mjs audit
      - name: Publish complete proof or incomplete original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-core-records-${{ matrix.key }}
          path: |
            job-out/${{ matrix.key }}
            !job-out/${{ matrix.key }}/*.node
            !job-out/${{ matrix.key }}/retained/work
          if-no-files-found: error

  aggregate:
    needs: [prepare, sensitivity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPLETIONS_DIR: ${{ github.workspace }}/completions
      AGGREGATE_PATH: ${{ github.workspace }}/final-core-acceptance.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.product_sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: final-core-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: final-core-records-*
          path: completions
          merge-multiple: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-audit the exact complete 10-job evidence set
        run: node driver/tools/main-diff/final-core-sensitivity.mjs aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: final-core-acceptance
          path: final-core-acceptance.json
          if-no-files-found: error
