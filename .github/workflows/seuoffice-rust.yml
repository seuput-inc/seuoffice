                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'lock-receipt.json').write_text(json.dumps(records, indent=2) + '\n')
          expected = {
              'crates/Cargo.lock': '416faccdcdba0612e2b1b6833b09871fdc10102d4b0a35ec33bb12c87069bb04',
              'crates/shell/Cargo.lock': 'ce74057ae77a5f395fde10eeb21e99da434c3947282e67457634022e0b8db9b3'}
          mismatches = [record for record in records
