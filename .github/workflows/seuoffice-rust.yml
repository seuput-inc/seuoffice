name: seuoffice current renderer native system-webview diagnostic
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact S8 source, corrected native renderer diagnostic only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: system-webview-diagnostic-${{ inputs.source_sha }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ad56ec727fc25695fd14261fdfe2b6a755da81a6
  SOURCE_PARENT: 1e9d0ec1ad96c7862dec0ee1b3ec7d47f3148483
  SOURCE_ACTUAL_PARENT: ff12e95b7398ce1d09bca6f6bd95d44dd68cc2cf
  SOURCE_MANIFEST_SHA256: 003d364cde721dd261a6cb189f650a4e78aa13616f87bb13ede1237bbf6dbcaa
  PROBE_MANIFEST_SHA256: 73f2a0ae72e02934285c018f949b06d34c4652d9172ce6aea1e1e67331dcf40d
  RHWP_TOOL_SHA256: f3a8f06da1371947aaef149e73d0810dd69fca94b760d3d8cca33d711e5c46f1
  PREPUSH_SHA256: 746d068d92907dea15376057a8523afeda36f0f29593a439137918855ccc22d5
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  input-audit:
    name: Exact S8 and separate diagnostic definition audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Bind one exact diagnostic input
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: test "$REQUESTED_SOURCE" = "$SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 9
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 8
          persist-credentials: false
      - name: Audit full source map, exact parent and actual definition delta
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/system-webview-input"
          mkdir -p "$out"
          status=0
          python3 - <<'PY' > "$out/stdout.log" 2> "$out/stderr.log" || status=$?
          import hashlib, json, os, pathlib, subprocess
          source = pathlib.Path('source')
          definition = pathlib.Path('definition')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'system-webview-input'
          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          def tree(root):
              result = {}
              for row in git(root, 'ls-tree', '-rz', 'HEAD').split(b'\0'):
                  if row:
                      left, path = row.split(b'\t')
                      mode, kind, oid = left.decode().split()
                      result[path.decode()] = (mode, kind, oid)
              return result
          sha = os.environ['SOURCE_SHA']
          base = os.environ['SOURCE_PARENT']
          assert git(source, 'rev-parse', 'HEAD').decode().strip() == sha
          assert git(source, 'rev-parse', 'HEAD^').decode().strip() == os.environ['SOURCE_ACTUAL_PARENT']
          assert git(source, 'merge-base', 'HEAD', base).decode().strip() == base
          assert git(definition, 'rev-parse', 'HEAD').decode().strip() == os.environ['GITHUB_SHA']
          assert git(definition, 'rev-parse', 'HEAD^').decode().strip() == sha
          assert git(definition, 'merge-base', 'HEAD', base).decode().strip() == base
          probe_path = pathlib.Path('crates/shell/ci/system-webview-probe-input.json')
          probe_bytes = (definition / probe_path).read_bytes()
          (out / probe_path.name).write_bytes(probe_bytes)
          assert hashlib.sha256(probe_bytes).hexdigest() == os.environ['PROBE_MANIFEST_SHA256']
          probe = json.loads(probe_bytes)
          assert probe['sourceSha'] == probe['definitionParent'] == sha
          assert probe['sourceActualParent'] == os.environ['SOURCE_ACTUAL_PARENT']
          assert probe['frozenPolicyBase'] == probe['frozenPrepush']['base'] == base
          assert probe['frozenPrepush']['sha256'] == os.environ['PREPUSH_SHA256']
          source_map_path = pathlib.Path('crates/shell/ci/system-webview-source-manifest.json')
          assert probe['sourceManifest']['path'] == source_map_path.as_posix()
          source_map_bytes = (definition / source_map_path).read_bytes()
          (out / source_map_path.name).write_bytes(source_map_bytes)
          assert hashlib.sha256(source_map_bytes).hexdigest() == os.environ['SOURCE_MANIFEST_SHA256'] == probe['sourceManifest']['sha256']
          manifest = json.loads(source_map_bytes)
          assert manifest['head'] == base and manifest['sourceParent'] == os.environ['SOURCE_ACTUAL_PARENT']
          assert manifest['entryCount'] == probe['sourceManifest']['entries'] == 1558
          assert manifest['composedFrom']['source'] == os.environ['SOURCE_ACTUAL_PARENT']
          assert manifest['composedFrom']['manifestSha256'] == '7da6732dae83996db09fd0d00da5bc50a3f41f7a2885f39ca83016a51918b19c'
          assert manifest['oldFailureRun'] == 43784764617
          entries = {entry['path']: entry for entry in manifest['entries']}
          changed_source = git(source, 'diff', '--name-only', '-z', base, 'HEAD').decode().split('\0')[:-1]
          assert len(manifest['entries']) == len(entries) == len(changed_source) == 1558
          assert set(changed_source) == set(entries)
          source_delta = git(source, 'diff', '--name-only', '-z', os.environ['SOURCE_ACTUAL_PARENT'], 'HEAD').decode().split('\0')[:-1]
          assert len(source_delta) == 15 and set(source_delta) == set(manifest['composedFrom']['deltaPaths'])
          source_tree, definition_tree = tree(source), tree(definition)
          blobs = deleted = 0
          for path, entry in entries.items():
              if entry['kind'] == 'delete':
                  assert path not in source_tree and not (source / path).exists(), path
                  deleted += 1
                  continue
              assert entry['kind'] == 'file', path
              mode, kind, oid = source_tree[path]
              assert kind == 'blob' and mode == ('100755' if int(entry['mode'], 8) & 0o111 else '100644'), path
              data = git(source, 'cat-file', 'blob', oid)
              assert len(data) == entry['size'] and hashlib.sha256(data).hexdigest() == entry['sha256'], path
              assert (source / path).read_bytes() == data, path
              blobs += 1
          assert blobs + deleted == 1558
          assert len(probe['scripts']) == len({entry['path'] for entry in probe['scripts']}) == 8
          expected = {'.github/workflows/seuoffice-rust.yml', probe_path.as_posix(), source_map_path.as_posix()}
          for entry in probe['scripts']:
              path = entry['path']
              assert path == 'tools/system-webview-probe/' + entry['packetPath'] and '..' not in pathlib.PurePosixPath(path).parts
              assert entry['mode'] == '100644'
              data = (definition / path).read_bytes()
              assert len(data) == entry['bytes'] and hashlib.sha256(data).hexdigest() == entry['sha256'], path
              expected.add(path)
          assert len(expected) == 11
          records = []
          expected_changes = set()
          for path in sorted(expected):
              mode, kind, oid = definition_tree[path]
              assert mode == '100644' and kind == 'blob', path
              data = git(definition, 'cat-file', 'blob', oid)
              assert (definition / path).read_bytes() == data, path
              before = source_tree.get(path)
              preimage = None
              if before is not None:
                  old = git(source, 'cat-file', 'blob', before[2])
                  preimage = {'mode': before[0], 'gitBlob': before[2], 'bytes': len(old), 'sha256': hashlib.sha256(old).hexdigest()}
              if before != definition_tree[path]:
                  expected_changes.add(path)
              records.append({'path': path, 'mode': mode, 'gitBlob': oid, 'bytes': len(data),
                              'sha256': hashlib.sha256(data).hexdigest(), 'preimage': preimage,
                              'changedFromExactSource': path in expected_changes})
          changed_definition = git(definition, 'diff', '--name-only', '-z', sha, 'HEAD').decode().split('\0')[:-1]
          assert len(changed_definition) == len(expected_changes) and set(changed_definition) == expected_changes
          for root in (source, definition):
              for path, expected_sha in ((probe['inheritedCanonicalRhwp']['path'], os.environ['RHWP_TOOL_SHA256']),
                                         (probe['frozenPrepush']['path'], os.environ['PREPUSH_SHA256'])):
                  assert hashlib.sha256((root / path).read_bytes()).hexdigest() == expected_sha, (str(root), path)
          assert probe['inheritedCanonicalRhwp']['sha256'] == os.environ['RHWP_TOOL_SHA256']
          assert source_tree['tools/build-rhwp-core.mjs'] == definition_tree['tools/build-rhwp-core.mjs']
          receipt = {'inputAudit': 'PASS', 'source': sha, 'sourceActualParent': os.environ['SOURCE_ACTUAL_PARENT'],
                     'definition': os.environ['GITHUB_SHA'], 'definitionParent': sha, 'frozenPolicyBase': base,
                     'sourceManifestSha256': os.environ['SOURCE_MANIFEST_SHA256'], 'sourceEntries': 1558,
                     'sourceBlobs': blobs, 'sourceDeletes': deleted, 'sourceDeltaPaths': source_delta,
                     'probeManifestSha256': os.environ['PROBE_MANIFEST_SHA256'],
                     'declaredPostimagePaths': 11, 'actualChangedPathCount': len(changed_definition),
                     'actualChangedPaths': changed_definition, 'definitionInputs': records,
                     'rhwpInheritedUnchanged': True, 'wholeCrate': 'NOT_CHECKED', 'app': 'NOT_CHECKED',
                     'candidate': 'NOT_CHECKED', 'package': 'NOT_CHECKED', 'nativeAuthority': 'NOT_CHECKED',
                     'uiRelease': 'NOT_CHECKED', 'productGreen': False}
          (out / 'input-binding.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
          cat "$out/stdout.log" "$out/stderr.log"
          printf '%s\n' "$status" > "$out/status.txt"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: system-webview-input-${{ github.run_id }}
          path: ${{ runner.temp }}/system-webview-input
          if-no-files-found: error
  native-diagnostic:
    name: Actual macOS WKWebView and locked Electron diagnostic, not app verification
    needs: input-audit
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize diagnostic-only execution state
        run: |
          mkdir -p "$RUNNER_TEMP/system-webview-diagnostic"
          printf '%s\n' '{"preparation":"NOT_RUN","nativeProbe":"NOT_RUN","wholeCrate":"NOT_CHECKED","app":"NOT_CHECKED","package":"NOT_CHECKED","nativeAuthority":"NOT_CHECKED","uiRelease":"NOT_CHECKED","productGreen":false}' > "$RUNNER_TEMP/system-webview-diagnostic/state.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: source-checkout
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: definition-checkout
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 9
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        id: node
        with:
          node-version-file: source/.nvmrc
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        id: wasm-toolchain
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip1
      - name: Bind exact native inputs and actual tool identities
        id: identity
        working-directory: source
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/system-webview-diagnostic/preparation/identity"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/definition" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/definition" rev-parse HEAD^)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/system-webview-diagnostic/inputs"
          cp "$GITHUB_WORKSPACE/definition/crates/shell/ci/system-webview-source-manifest.json" "$RUNNER_TEMP/system-webview-diagnostic/inputs/"
          cp "$GITHUB_WORKSPACE/definition/crates/shell/ci/system-webview-probe-input.json" "$RUNNER_TEMP/system-webview-diagnostic/inputs/"
          printf 'source=%s\ndefinition=%s\n' "$SOURCE_SHA" "$GITHUB_SHA"
          printf '%s  %s\n' "$RHWP_TOOL_SHA256" tools/build-rhwp-core.mjs | shasum -a 256 -c -
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12); print(sys.version); print(sys.executable)'
          node --version
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Install only fully hashed binary probe dependencies
        id: binary-requirements
        working-directory: source
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/system-webview-diagnostic/preparation/binary-requirements"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          set -euo pipefail
          python3 -m pip install --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/definition/tools/system-webview-probe/requirements.txt"
          python3 -m pip list --format=json
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Install actual locked workspace dependencies without lifecycle scripts
        id: npm-ci
        working-directory: source
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/system-webview-diagnostic/preparation/npm-ci"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          set -euo pipefail
          npm ci --ignore-scripts
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Prepare official inherited RHWP source and actual locked office WASM
        id: wasm
        working-directory: source
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/system-webview-diagnostic/preparation/wasm"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          set -euo pipefail
          node tools/build-rhwp-core.mjs --source-only
          node crates/office-wasm/build.mjs
          test -s crates/target/wasm32-wasip1/release/office_wasm.wasm
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Build only the current docs renderer with its canonical Vite config
        id: docs-renderer
        working-directory: source
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/system-webview-diagnostic/preparation/docs-renderer"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          set -euo pipefail
          node node_modules/vite/bin/vite.js build --config apps/docs/vite.web.config.ts
          test -s apps/web/dist/docs/index.html
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Download the exact locked Electron only for this owned install
        id: electron-install
        working-directory: source
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/system-webview-diagnostic/preparation/electron-install"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          set -euo pipefail
          node - <<'JS'
          const lock = require('./package-lock.json').packages['node_modules/electron']
          const installed = require('./node_modules/electron/package.json')
          if (lock.version !== '43.8.3' || installed.version !== lock.version || !lock.integrity) {
            throw new Error('Exact locked Electron 43.8.3 input is required')
          }
          console.log(JSON.stringify({ version: lock.version, integrity: lock.integrity, resolved: lock.resolved }))
          JS
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD node node_modules/electron/install.js
          test -x node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Observe each actual native engine once with owned synthetic inputs
        id: native-probe
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'system-webview-diagnostic'
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          repo = (workspace / 'source').resolve()
          probe = (workspace / 'definition/tools/system-webview-probe').resolve()
          output = root / 'probe-output'
          if output.exists():
              raise FileExistsError('The probe output must be new; no deletion or reuse')
          command = [sys.executable, str(probe / 'run_probe.py'), '--repo', str(repo), '--probe', str(probe),
                     '--electron', str(repo / 'node_modules/electron/dist/Electron.app/Contents/MacOS/Electron'),
                     '--output', str(output)]
          record = {'state': 'RUNNING', 'command': command, 'returncode': None, 'productGreen': False}
          record_path = root / 'probe-invocation.json'
          record_path.write_text(json.dumps(record, indent=2) + '\n')
          try:
              with (root / 'probe.stdout').open('wb') as stdout, (root / 'probe.stderr').open('wb') as stderr:
                  result = subprocess.run(command, cwd=repo, stdout=stdout, stderr=stderr)
          except OSError as error:
              record.update(state='LAUNCH_FAILED', launchError=str(error))
              record_path.write_text(json.dumps(record, indent=2) + '\n')
              raise
          record.update(state='COMPLETED' if result.returncode == 0 else 'FAILED', returncode=result.returncode)
          record_path.write_text(json.dumps(record, indent=2) + '\n')
          print((root / 'probe.stdout').read_text(errors='replace'))
          print((root / 'probe.stderr').read_text(errors='replace'), file=sys.stderr)
          sys.exit(result.returncode)
          PY
      - name: Preserve actual partial observation and never infer product success
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.native-probe.outcome }}
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'system-webview-diagnostic'
          root.mkdir(parents=True, exist_ok=True)
          path = root / 'probe-invocation.json'
          invocation = json.loads(path.read_text()) if path.exists() else {'state': 'NOT_RUN', 'returncode': None}
          comparison_path = root / 'probe-output/comparison.json'
          comparison = json.loads(comparison_path.read_text()) if comparison_path.exists() else None
          electron_result_path = root / 'probe-output/electron/result.json'
          electron_result = json.loads(electron_result_path.read_text()) if electron_result_path.exists() else {}
          observed_electron = electron_result.get('screenshot', {}).get('electron')
          preparation = {path.parent.name: path.read_text().strip() for path in sorted((root / 'preparation').glob('*/status.txt'))}
          complete = (os.environ['PROBE_OUTCOME'] == 'success' and invocation.get('returncode') == 0
                      and comparison is not None and comparison['state'] == 'MATCH'
                      and comparison['productGreen'] is False and observed_electron == '43.8.3')
          state = {'kind': 'throwaway-current-renderer-native-engine-diagnostic',
                   'source': os.environ['SOURCE_SHA'], 'definition': os.environ['GITHUB_SHA'],
                   'preparation': preparation, 'stepOutcomes': json.loads(os.environ['STEP_OUTCOMES']),
                   'nativeProbe': invocation, 'comparison': comparison,
                   'observedElectronVersion': observed_electron,
                   'state': 'DIAGNOSTIC_MATCH' if complete else 'PREPARATION_BLOCKED_NATIVE_NOT_RUN' if invocation['state'] == 'NOT_RUN' else 'DIAGNOSTIC_NON_SUCCESS_SEE_RAW_EVIDENCE',
                   'printMode': 'diagnostic-cloned-dom', 'wholeCrate': 'NOT_CHECKED', 'app': 'NOT_CHECKED',
                   'candidate': 'NOT_CHECKED', 'package': 'NOT_CHECKED', 'nativeAuthority': 'NOT_CHECKED',
                   'uiRelease': 'NOT_CHECKED', 'privateCefAbi': 'NOT_CHECKED', 'productGreen': False,
                   'limits': 'One synthetic current-renderer document per real engine; no full-web, native product, platform selection or release acceptance claim.'}
          (root / 'state.json').write_text(json.dumps(state, indent=2) + '\n')
          print(json.dumps(state, indent=2))
          sys.exit(0 if complete else 1)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: system-webview-native-${{ github.run_id }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/system-webview-diagnostic
            !${{ runner.temp }}/system-webview-diagnostic/probe-output/site/**
            !${{ runner.temp }}/system-webview-diagnostic/probe-output/*/electron-user-data/**
          if-no-files-found: error
  genuine-policy:
    name: Required unchanged prepush, original full scope
    needs: input-audit
    strategy:
      fail-fast: false
      matrix:
        scope: [source, definition]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 9
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.nvmrc
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Bind original criterion and initialize policy receipt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whole-app-policy"
          printf 'PREPARATION/INPUT/BLOCKED\nprepush=NOT_RUN\nproductGreen=false\n' > "$RUNNER_TEMP/whole-app-policy/status.txt"
          test "$(git merge-base HEAD "$SOURCE_PARENT")" = "$SOURCE_PARENT"
          printf '%s  %s\n' 746d068d92907dea15376057a8523afeda36f0f29593a439137918855ccc22d5 tools/prepush.mjs | sha256sum -c -
          printf '%s  %s\n' f3a8f06da1371947aaef149e73d0810dd69fca94b760d3d8cca33d711e5c46f1 tools/build-rhwp-core.mjs | sha256sum -c -
          printf 'scope=%s\nhead=%s\npolicy_base=%s\n' '${{ matrix.scope }}' "$(git rev-parse HEAD)" "$SOURCE_PARENT" > "$RUNNER_TEMP/whole-app-policy/identity.txt"
      - name: Install exact actionlint for the canonical workflow check
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Preserve actual Cargo locks, input
        env:
          LOCK_STAGE: input
          LOCK_OUTPUT: ${{ runner.temp }}/whole-app-policy/locks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['LOCK_OUTPUT']) / os.environ['LOCK_STAGE']
          out.mkdir(parents=True, exist_ok=True)
