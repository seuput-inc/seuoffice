<!doctype html>
<html lang="ko">
  <meta charset="utf-8" />
  <title>문서 제목 견본</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }
    body {
      font:
        11pt/1.5 'Malgun Gothic',
        'Apple SD Gothic Neo',
        'Noto Sans CJK KR',
        'Segoe UI',
        sans-serif;
    }
    .page {
      height: 5.5in;
      break-after: page;
      overflow: hidden;
    }
    .page:last-child {
      break-after: auto;
    }
    .marker {
      width: 36pt;
      height: 36pt;
      background: #000;
    }
    .bg {
      margin-top: 8pt;
      height: 60pt;
      background: #1e3a8a;
      color: #fff;
    }
    h1 {
      font-size: 16pt;
      margin: 10pt 0 4pt;
    }
  </style>
  <body>
    <div class="page" data-n="1">
      <div class="marker"></div>
      <div class="bg">배경 상자 하나</div>
      <h1>제1장 개요</h1>
      <p>
        대한민국 문서 본문 시험입니다. 안녕하세요. The quick brown fox jumps over the lazy dog
        1234567890.
      </p>
    </div>
    <div class="page" data-n="2">
      <div class="marker"></div>
      <div class="bg">배경 상자 둘</div>
      <h1>제2장 본문</h1>
      <p>둘째 쪽입니다. 숫자 3.14159 와 영문 Hello, world 를 함께 둡니다.</p>
    </div>
    <div class="page" data-n="3">
      <div class="marker"></div>
      <div class="bg">배경 상자 셋</div>
      <h1>제3장 결론</h1>
      <p>셋째 쪽입니다. 끝.</p>
    </div>
  </body>
  <script src="probe.js"></script>
  <script>
    P.log('p4.page', { page: 'docs', pages: document.querySelectorAll('.page').length })
    P.done({ pages: 3 })
  </script>
</html>
