name: seuoffice NSS synthetic wrap observation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nss-wrap-observation-${{ inputs.source_sha }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_BASE: 54d63f2eb1d9b09c64e8afe70a324cad21863101
  DEFINITION_BASE: 0c4de3f8d29b273a50663b772ed97f2a1867812f
  SOURCE_PARENT: fff703ca06b625ab0e94c1c67bc0673cc0f7e760
  DEFINITION_PARENT: 119ff25cf3789225037f03427e45d839c59672c5
  IMAGE_DIGEST: sha256:890e8b5c0040e1deff5cc7dc7b4414e67069f79e3301afc4ec5bd49d64ef13e5
jobs:
  native-observation:
    name: Real NSS native observation, independently required
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: source
    container:
      image: buildpack-deps@sha256:890e8b5c0040e1deff5cc7dc7b4414e67069f79e3301afc4ec5bd49d64ef13e5
    steps:
      - name: Validate immutable source input
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = ce4483523e6010dec9b919eb17623dc8bdffbe29
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
      - name: Record definition and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/definition" rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/nss-results"
          printf 'definition_sha=%s\nsource_sha=%s\nimage_digest=%s\n' "$GITHUB_SHA" "$SOURCE_SHA" "$IMAGE_DIGEST" | tee "$RUNNER_TEMP/nss-results/identity.txt"
          sha256sum "$GITHUB_WORKSPACE/definition/.github/workflows/seuoffice-rust.yml" | tee "$RUNNER_TEMP/nss-results/definition.sha256"
          sha256sum tools/nss-helper/{contract.json,produce.py,patch_nss.py,test_patch.py,launcher.rs,hosted-validation.py,hosted-proof.py,external-fixture.py,fixture_utils.py,test_fixture_utils.py,test_token_wrapper.c,test_softhsm_init.c} crates/shell/src/host/d2/pdf/crypto/{nss_export_helper.c,nss_export_helper_test.c,worker/nss_bundle.rs,worker/nss_exchange.rs,worker/nss_bridge.rs} crates/shell/src/{signer_child_guard.rs,index_worker_process.rs} crates/shell/{nss_manifest.rs,nss_build.rs,build.rs} | tee "$RUNNER_TEMP/nss-results/sources.sha256"
          printf '%s  %s\n' 64c82ffe03995e6a518998c90ae354920473d48e0f35caaa01afadd5b938c4d6 tools/prepush.mjs | sha256sum -c -
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          test "$(git rev-parse HEAD^^^)" = "$SOURCE_BASE"
          test "$(git -C "$GITHUB_WORKSPACE/definition" rev-parse HEAD^)" = "$DEFINITION_PARENT"
          test "$(git -C "$GITHUB_WORKSPACE/definition" rev-parse HEAD^^^)" = "$DEFINITION_BASE"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          definition = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'definition'
          results = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nss-results'
          manifest_path = definition / '.github/validation/nss-wrap-observation-manifest.json'
          manifest_bytes = manifest_path.read_bytes()
          manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
          if manifest_sha != '7f59d0557154ac177f75a4fb5db7421dbccf2cecad672030fbe759c80e1fb1fa':
              raise RuntimeError('wrap observation input manifest changed')
          (results / manifest_path.name).write_bytes(manifest_bytes)
          manifest = json.loads(manifest_bytes)
          if (manifest['sourceParent'] != os.environ['SOURCE_PARENT']
                  or manifest['definitionParent'] != os.environ['DEFINITION_PARENT']
                  or manifest['frozenPolicySourceBase'] != os.environ['SOURCE_BASE']
                  or manifest['frozenPolicyDefinitionBase'] != os.environ['DEFINITION_BASE']):
              raise RuntimeError('publication parent or frozen policy base mismatch')
          observed = {}
          for entry in manifest['files']:
              base = subprocess.check_output(['git', 'show', manifest['sourceParent'] + ':' + entry['path']])
              if hashlib.sha256(base).hexdigest() != entry['baseObservedSha256']:
                  raise RuntimeError('observed-run base bytes differ: ' + entry['path'])
              data = pathlib.Path(entry['path']).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != entry['size'] or digest != entry['sha256']:
                  raise RuntimeError('final packet bytes differ: ' + entry['path'])
              observed[entry['path']] = digest
          changed = subprocess.check_output(['git', 'diff', '--name-only', manifest['sourceParent'], 'HEAD'], text=True).splitlines()
          if len(changed) != 1 or set(changed) != set(observed):
              raise RuntimeError('source contains changes outside the reviewed wrapper')
          changed_definition = subprocess.check_output(['git', '-C', str(definition), 'diff', '--name-only', manifest['definitionParent'], 'HEAD'], text=True).splitlines()
          if set(changed_definition) != {'.github/workflows/seuoffice-rust.yml', '.github/validation/nss-wrap-observation-manifest.json'} or len(changed_definition) != 2:
              raise RuntimeError('definition contains unrelated changes')
          advanced_path = definition / '.github/validation/nss-failure-phases-manifest.json'
          advanced_bytes = advanced_path.read_bytes()
          advanced_sha = hashlib.sha256(advanced_bytes).hexdigest()
          if advanced_sha != '77010c6f6c4f03675e46bb6e0915b1987668b01ccbde159cc4f18cb26e0228c5':
              raise RuntimeError('retained failure-phase manifest changed')
          advanced = json.loads(advanced_bytes)
          if (advanced['sourceParent'] != '4e30e7d08f223d2e4cc307599c66ba4d16758f9a'
                  or advanced['definitionParent'] != 'dd1564724ffec7d6e571db0fa3652113c1163c2d'
                  or advanced['frozenPolicySourceBase'] != os.environ['SOURCE_BASE']
                  or advanced['frozenPolicyDefinitionBase'] != os.environ['DEFINITION_BASE']):
              raise RuntimeError('retained failure-phase parents or policy bases changed')
          for entry in advanced['files']:
              data = subprocess.check_output(['git', 'show', manifest['sourceParent'] + ':' + entry['path']])
              if len(data) != entry['size'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise RuntimeError('retained failure-phase input changed: ' + entry['path'])
              if entry['path'] not in observed and pathlib.Path(entry['path']).read_bytes() != data:
                  raise RuntimeError('retained failure-phase source no longer identical: ' + entry['path'])
          (results / advanced_path.name).write_bytes(advanced_bytes)
          retained_path = definition / '.github/validation/nss-child-stderr-manifest.json'
          retained_bytes = retained_path.read_bytes()
          if hashlib.sha256(retained_bytes).hexdigest() != 'd05d267ce29b232e075009a7c5a9a5666ce1a28aa8bdcc918a1c734eedb62f8c':
              raise RuntimeError('retained V3 manifest changed')
          retained = json.loads(retained_bytes)
          if (retained['sourceParent'] != os.environ['SOURCE_BASE']
                  or retained['definitionParent'] != os.environ['DEFINITION_BASE']):
              raise RuntimeError('retained V3 policy bases changed')
          advanced_paths = {entry['path'] for entry in advanced['files']}
          for entry in retained['files']:
              data = subprocess.check_output(['git', 'show', advanced['sourceParent'] + ':' + entry['path']])
              if len(data) != entry['size'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise RuntimeError('retained V3 source input changed: ' + entry['path'])
              if entry['path'] not in advanced_paths and pathlib.Path(entry['path']).read_bytes() != data:
                  raise RuntimeError('retained V3 source no longer identical: ' + entry['path'])
          retained_hashes = {
              'tools/nss-helper/hosted-proof.py': advanced['retainedV3Inputs']['proofSha256'],
              'tools/nss-helper/test_fixture_utils.py': advanced['retainedV3Inputs']['testsSha256'],
              'crates/shell/src/host/d2/pdf/crypto/worker/nss_bundle.rs': advanced['retainedV3Inputs']['bundleSha256']}
          for path, expected in retained_hashes.items():
              if hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() != expected:
                  raise RuntimeError('retained V3 proof, tests or spawn seam changed: ' + path)
          (results / retained_path.name).write_bytes(retained_bytes)
          binding = {'sourceSha': os.environ['SOURCE_SHA'], 'definitionSha': os.environ['GITHUB_SHA'],
                     'sourceParent': manifest['sourceParent'], 'definitionParent': manifest['definitionParent'],
                     'sourceFiles': observed, 'manifestSha256': manifest_sha,
                     'frozenPolicySourceBase': manifest['frozenPolicySourceBase'],
                     'frozenPolicyDefinitionBase': manifest['frozenPolicyDefinitionBase'],
                     'originalFailureRun': manifest['originalFailureRun'],
                     'originalFailure': manifest['originalFailure'],
                     'observation': manifest['observation'], 'staticEvidence': manifest['staticEvidence'],
                     'diagnosticBuild': advanced['diagnosticBuild'],
                     'retainedV3Inputs': advanced['retainedV3Inputs'],
                     'retainedFailurePhaseManifestSha256': advanced_sha,
                     'retainedManifestSha256': hashlib.sha256(retained_bytes).hexdigest(),
                     'testBuild': retained['testBuild'], 'redactionReview': retained['redactionReview'],
                     'observationOnly': True, 'policyOrProductGreen': False, 'newRuntimeObserved': False}
          (results / 'input-binding.json').write_text(json.dumps(binding, indent=2) + '\n')
          print(json.dumps(binding, indent=2))
          PY
      - name: Run all ten fixture, real-child, boundary and overlap tests
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          fixture_status=0
          python3 -B tools/nss-helper/test_fixture_utils.py 2>&1 | tee "$RUNNER_TEMP/nss-results/fixture-tests.log" || fixture_status=$?
          printf '%s\n' "$fixture_status" > "$RUNNER_TEMP/nss-results/fixture-tests-status.txt"
          exit "$fixture_status"
      - name: Prepare pinned helper tools and source archives
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/nss-home"
          mkdir -p "$HOME" "$RUNNER_TEMP/nss-inputs" "$RUNNER_TEMP/nss-tools"
          curl -fsSL https://archive.ubuntu.com/ubuntu/pool/universe/p/patchelf/patchelf_0.18.0-1.1build1_amd64.deb -o "$RUNNER_TEMP/nss-inputs/patchelf.deb"
          echo '962a43e33cd56061522554898557a038ccbb8aa4e1e0f421b2d6f6adf1f80c60  '"$RUNNER_TEMP/nss-inputs/patchelf.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/nss-inputs/patchelf.deb" "$RUNNER_TEMP/nss-tools"
          curl -fsSL 'https://security.ubuntu.com/ubuntu/pool/main/b/bison/bison_3.8.2+dfsg-1ubuntu0.24.04.1_amd64.deb' -o "$RUNNER_TEMP/nss-inputs/bison.deb"
          curl -fsSL 'https://security.ubuntu.com/ubuntu/pool/main/g/gawk/gawk_5.2.1-2ubuntu0.1_amd64.deb' -o "$RUNNER_TEMP/nss-inputs/gawk.deb"
          curl -fsSL 'https://archive.ubuntu.com/ubuntu/pool/main/libs/libsigsegv/libsigsegv2_2.14-1ubuntu2_amd64.deb' -o "$RUNNER_TEMP/nss-inputs/libsigsegv.deb"
          printf '%s  %s\n' 9d75084d1293f68f3c1a2ee677dea5baa4e010bac2d4c455d8e23177e97aa353 "$RUNNER_TEMP/nss-inputs/bison.deb" baaf6853bea746485bff4ae0e506599b3c5093ebe6ec9b9584e4272f94f75b93 "$RUNNER_TEMP/nss-inputs/gawk.deb" 889f338bea4ebfd999939d946da4ac0a45668264a5aae78e023feeb0529505b8 "$RUNNER_TEMP/nss-inputs/libsigsegv.deb" | sha256sum -c -
          dpkg -i "$RUNNER_TEMP/nss-inputs/libsigsegv.deb"
          dpkg -i "$RUNNER_TEMP/nss-inputs/gawk.deb" "$RUNNER_TEMP/nss-inputs/bison.deb"
          sha256sum "$(command -v bison)" "$(command -v gawk)" "$RUNNER_TEMP/nss-tools/usr/bin/patchelf" | tee "$RUNNER_TEMP/nss-results/additional-tools.sha256"
          curl -fsSL 'https://github.com/opendnssec/opendnssec/releases/download/2.1.14/softhsm-2.6.1.tar.gz' -o "$RUNNER_TEMP/nss-inputs/softhsm-2.6.1.tar.gz"
          echo '61249473054bcd1811519ef9a989a880a7bdcc36d317c9c25457fc614df475f2  '"$RUNNER_TEMP/nss-inputs/softhsm-2.6.1.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          pins = json.loads(pathlib.Path('tools/nss-helper/contract.json').read_text())['sources']
          for name in ('nss', 'sqlite', 'glibc'):
              pin = pins[name]
              urllib.request.urlretrieve(pin['url'], root / 'nss-inputs' / pin['filename'])
          PY
      - name: Build and validate the NSS artifact set
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export HOME="$RUNNER_TEMP/nss-home"
          native_status=0
          python3 tools/nss-helper/hosted-validation.py --image-digest "$IMAGE_DIGEST" --inputs "$RUNNER_TEMP/nss-inputs" --patchelf "$RUNNER_TEMP/nss-tools/usr/bin/patchelf" --work "$RUNNER_TEMP/nss-work" --output "$RUNNER_TEMP/nss-output" --results "$RUNNER_TEMP/nss-results" --fixture-setup tools/nss-helper/external-fixture.py 2>&1 | tee "$RUNNER_TEMP/nss-results/validation.log" || native_status=$?
          printf '%s\n' "$native_status" > "$RUNNER_TEMP/nss-results/native-status.txt"
          exit "$native_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nss-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/nss-results
          if-no-files-found: error
  frozen-prepush:
    name: Unchanged genuine prepush, independently required
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: buildpack-deps@sha256:890e8b5c0040e1deff5cc7dc7b4414e67069f79e3301afc4ec5bd49d64ef13e5
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Validate immutable source input
        working-directory: .
        run: test "$SOURCE_SHA" = ce4483523e6010dec9b919eb17623dc8bdffbe29
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          persist-credentials: false
          fetch-depth: 4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.nvmrc
      - name: Bind exact inputs and unchanged canonical rhwp prerequisite
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nss-prepush"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_PARENT"
          test "$(git rev-parse HEAD^^^)" = "$SOURCE_BASE"
          test "$(git -C "$GITHUB_WORKSPACE/definition" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/definition" rev-parse HEAD^)" = "$DEFINITION_PARENT"
          test "$(git -C "$GITHUB_WORKSPACE/definition" rev-parse HEAD^^^)" = "$DEFINITION_BASE"
          printf '%s  %s\n' 64c82ffe03995e6a518998c90ae354920473d48e0f35caaa01afadd5b938c4d6 tools/prepush.mjs | sha256sum -c -
          sha256sum "$GITHUB_WORKSPACE/definition/.github/workflows/seuoffice-rust.yml" > "$RUNNER_TEMP/nss-prepush/definition.sha256"
          printf 'source_sha=%s\nsource_base=%s\ndefinition_sha=%s\ndefinition_base=%s\n' "$SOURCE_SHA" "$SOURCE_BASE" "$GITHUB_SHA" "$DEFINITION_BASE" > "$RUNNER_TEMP/nss-prepush/identity.txt"
          printf 'source_parent=%s\ndefinition_parent=%s\n' "$SOURCE_PARENT" "$DEFINITION_PARENT" >> "$RUNNER_TEMP/nss-prepush/identity.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          results = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nss-prepush'
          definition = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'definition'
          manifest_path = definition / '.github/validation/nss-wrap-observation-manifest.json'
          manifest_bytes = manifest_path.read_bytes()
          if hashlib.sha256(manifest_bytes).hexdigest() != '7f59d0557154ac177f75a4fb5db7421dbccf2cecad672030fbe759c80e1fb1fa':
              raise RuntimeError('final policy input manifest changed')
          (results / manifest_path.name).write_bytes(manifest_bytes)
          manifest = json.loads(manifest_bytes)
          if (manifest['sourceParent'] != os.environ['SOURCE_PARENT']
                  or manifest['definitionParent'] != os.environ['DEFINITION_PARENT']
                  or manifest['frozenPolicySourceBase'] != os.environ['SOURCE_BASE']
                  or manifest['frozenPolicyDefinitionBase'] != os.environ['DEFINITION_BASE']):
              raise RuntimeError('policy publication parents or frozen scope changed')
          advanced_path = definition / '.github/validation/nss-failure-phases-manifest.json'
          advanced_bytes = advanced_path.read_bytes()
          if hashlib.sha256(advanced_bytes).hexdigest() != '77010c6f6c4f03675e46bb6e0915b1987668b01ccbde159cc4f18cb26e0228c5':
              raise RuntimeError('retained failure-phase policy manifest changed')
          (results / advanced_path.name).write_bytes(advanced_bytes)
          retained_path = definition / '.github/validation/nss-child-stderr-manifest.json'
          retained_bytes = retained_path.read_bytes()
          if hashlib.sha256(retained_bytes).hexdigest() != 'd05d267ce29b232e075009a7c5a9a5666ce1a28aa8bdcc918a1c734eedb62f8c':
              raise RuntimeError('retained V3 policy manifest changed')
          (results / retained_path.name).write_bytes(retained_bytes)
          tool_sha = hashlib.sha256(pathlib.Path('tools/build-rhwp-core.mjs').read_bytes()).hexdigest()
          vendor = pathlib.Path('vendor/rhwp-core/package.json')
          vendor_sha = hashlib.sha256(vendor.read_bytes()).hexdigest()
          if (tool_sha != '8ee967e10d3f848a3d68d1a22a5bef5220c1a2de02bac20fa5813f8b075aa2ee'
                  or vendor_sha != 'fab293a2e4695f82110444fbd15874ffad0180fdf81b998b670833f6a21e5bd6'):
              raise RuntimeError('canonical rhwp preparation tool or manifest changed')
          pins = json.loads(vendor.read_text())['rhwp']
          if pins['tag'] != 'v0.9.0' or pins['commit'] != 'c9095c5f67632e6721e800ccc7fb43ea49d26682':
              raise RuntimeError('canonical rhwp source pin changed')
          patches = [{'path': 'vendor/rhwp-core/patches/' + name,
                      'sha256': hashlib.sha256((pathlib.Path('vendor/rhwp-core/patches') / name).read_bytes()).hexdigest()}
                     for name in pins['patches']]
          patch_set_sha = hashlib.sha256(json.dumps(patches, separators=(',', ':')).encode()).hexdigest()
          if patch_set_sha != '633b31a0011d9bb7773de9e257df389ea0ab5dc5ba8c66afc1097d3d03763691':
              raise RuntimeError('canonical rhwp ordered patch set changed')
          receipt = {'sourceSha': os.environ['SOURCE_SHA'], 'definitionSha': os.environ['GITHUB_SHA'],
                     'toolSha256': tool_sha, 'manifestSha256': vendor_sha, 'pins': pins,
                     'patches': patches, 'orderedPatchSetSha256': patch_set_sha,
                     'command': 'node tools/build-rhwp-core.mjs --source-only',
                     'toolOrPinOrPolicyChanged': False, 'nativeObservationIsPolicyGreen': False}
          (results / 'rhwp-preparation-inputs.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Run the full unchanged policy on both actual base scopes
        run: |
          set -euo pipefail
          source_status=0
          (
            npm ci --ignore-scripts &&
            node tools/build-rhwp-core.mjs --source-only &&
            test -f crates/.rhwp-source/v0.9.0/Cargo.toml &&
            test "$(git -C crates/.rhwp-source/v0.9.0 rev-parse HEAD)" = c9095c5f67632e6721e800ccc7fb43ea49d26682 &&
            node tools/prepush.mjs --base "$SOURCE_BASE"
          ) 2>&1 | tee "$RUNNER_TEMP/nss-prepush/prepush-source.log" || source_status=$?
          definition_status=0
          (
            cd "$GITHUB_WORKSPACE/definition" &&
            npm ci --ignore-scripts &&
            node "$GITHUB_WORKSPACE/source/tools/prepush.mjs" --base "$DEFINITION_BASE"
          ) 2>&1 | tee "$RUNNER_TEMP/nss-prepush/prepush-definition.log" || definition_status=$?
          printf 'source_status=%s\ndefinition_status=%s\n' "$source_status" "$definition_status" | tee "$RUNNER_TEMP/nss-prepush/status.txt"
          test "$source_status" -eq 0
          test "$definition_status" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nss-frozen-prepush-${{ github.run_id }}
          path: ${{ runner.temp }}/nss-prepush
          if-no-files-found: error
