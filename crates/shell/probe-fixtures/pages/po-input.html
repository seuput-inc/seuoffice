<!doctype html>
<meta charset="utf-8" />
<title>po input</title>
<body>
  <textarea id="t" rows="3" cols="30">hello world</textarea>
  <div id="ce" contenteditable="true" style="border: 1px solid #888; width: 200px; height: 40px">
    abc
  </div>
</body>
<script src="probe.js"></script>
<script>
  window.__keys = []
  addEventListener('keydown', (event) => {
    window.__keys.push({
      key: event.key,
      code: event.code,
      trusted: event.isTrusted,
      ctrl: event.ctrlKey,
      meta: event.metaKey,
    })
  })
  P.log('po.input.load', {})
  P.done({})
</script>
