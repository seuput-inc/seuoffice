name: seuoffice original reply SDK observation
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact S8 lineage anchor only; SDK observation is not app acceptance
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-original-reply-${{ github.sha }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ad56ec727fc25695fd14261fdfe2b6a755da81a6
  SOURCE_PARENT: 1e9d0ec1ad96c7862dec0ee1b3ec7d47f3148483
  POLICY_SHA256: 746d068d92907dea15376057a8523afeda36f0f29593a439137918855ccc22d5
  RHWP_TOOL_SHA256: f3a8f06da1371947aaef149e73d0810dd69fca94b760d3d8cca33d711e5c46f1
jobs:
  input-audit:
    name: Required exact SDK observer inputs, not product acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 9
          persist-credentials: false
      - name: Bind immutable S8 lineage and exact seven-path definition
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
          INPUT_PINS: '{"crates/shell/ci/native-original-reply-input.json":{"sha256":"ea55c89e18ceb9bbe810b3aa9f56adb925feafe962601e9cb0ec31c3bdedffbb","bytes":1219,"mode":"100644"},"tools/native-original-reply-observation/requirements.txt":{"sha256":"432147e4047a213a9846367adce7b4ebee3b507d8ac7c0120aaabf37f58437d3","bytes":505,"mode":"100644"},"tools/native-original-reply-observation/macos/wk_reply_probe.py":{"sha256":"903063728aaef1dec8a6d9acb457641d82ac32319d2d4e759365342efc5fdc76","bytes":12849,"mode":"100644"},"tools/native-original-reply-observation/windows/Program.cs":{"sha256":"f6e1988988aa7bf974bdd9352b525700bcdaa0c4df5108f055a334d836300c3e","bytes":8960,"mode":"100644"},"tools/native-original-reply-observation/windows/Observer.csproj":{"sha256":"5e520e9798be85a31146a006099aae7ea7847f1bfc7c548e1e2522cdb28c3ace","bytes":471,"mode":"100644"},"tools/native-original-reply-observation/windows/packages.lock.json":{"sha256":"eaa55b158255f9bf25418fa0a755c4607538532424efd5db68b5dd2f301aece4","bytes":345,"mode":"100644"}}'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-original-reply-audit'
          out.mkdir(exist_ok=False)
          record = {'state': 'RUNNING', 'productGreen': False}
          receipt = out / 'audit.json'
          receipt.write_text(json.dumps(record, indent=2) + '\n')
          try:
              repo = pathlib.Path('definition')
              def git(*args):
                  return subprocess.check_output(['git', *args], cwd=repo).decode().strip()
              assert os.environ['REQUESTED_SOURCE'] == os.environ['SOURCE_SHA']
              assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
              assert git('rev-parse', 'HEAD^') == os.environ['SOURCE_SHA']
              assert git('merge-base', 'HEAD', os.environ['SOURCE_PARENT']) == os.environ['SOURCE_PARENT']
              expected = json.loads(os.environ['INPUT_PINS'])
              scope = dict(line.split('\t', 1)[::-1] for line in git('diff-tree', '--no-commit-id', '--name-status', '-r', 'HEAD').splitlines())
              assert scope == {'.github/workflows/seuoffice-rust.yml': 'M', **{p: 'A' for p in expected}}
              observed = []
              for relative, pin in expected.items():
                  assert not git('ls-tree', 'HEAD^', '--', relative)
                  path = repo / relative
                  assert path.is_file() and not path.is_symlink()
                  blob = git('ls-tree', 'HEAD', '--', relative).split('\t')[0].split()
                  assert blob[0] == pin['mode'] and blob[1] == 'blob'
                  content = path.read_bytes()
                  assert len(content) == pin['bytes'] and hashlib.sha256(content).hexdigest() == pin['sha256']
                  observed.append({'path': relative, **pin, 'gitBlob': blob[2]})
              old_workflow = subprocess.check_output(['git', 'show', 'HEAD^:.github/workflows/seuoffice-rust.yml'], cwd=repo)
              assert len(old_workflow) == 42065 and hashlib.sha256(old_workflow).hexdigest() == '7d5ad1fea2d6bd13d8fcfe4f877f4944240dd7b291e2777c07d02d9bcbde4ab2'
              for relative, expected_hash in [('tools/prepush.mjs', os.environ['POLICY_SHA256']), ('tools/build-rhwp-core.mjs', os.environ['RHWP_TOOL_SHA256'])]:
                  assert hashlib.sha256((repo / relative).read_bytes()).hexdigest() == expected_hash
              manifest = json.loads((repo / 'crates/shell/ci/native-original-reply-input.json').read_bytes())
              assert manifest['source'] == os.environ['SOURCE_SHA']
              assert manifest['windowsOriginalReplyApiExercised'] is False
              record.update(state='INPUTS_BOUND', source=os.environ['SOURCE_SHA'], definition=os.environ['GITHUB_SHA'], actualScope=scope, files=observed)
          except BaseException as error:
              record.update(state='INPUT_FAIL', error=f'{type(error).__name__}: {error}')
              raise
          finally:
              receipt.write_text(json.dumps(record, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-original-reply-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/native-original-reply-audit
          if-no-files-found: error
  macos-observation:
    name: Required WKScriptMessageHandlerWithReply observation only
    needs: input-audit
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Reserve fresh synthetic observation root
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/native-original-reply-macos"
          test ! -e "$root"
          mkdir "$root"
          printf 'OBSERVATION_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          printf '%s\n' '{"preparation":"NOT_RUN","native":"NOT_RUN","productGreen":false,"securityAcceptance":false}' > "$root/state.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 9
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned existing SDK inputs and preserve raw results
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['OBSERVATION_ROOT'])
          log = root / 'preparation'
          log.mkdir()
          state = {'state': 'RUNNING', 'native': 'NOT_RUN', 'productGreen': False}
          receipt = log / 'status.json'
          def save():
              receipt.write_text(json.dumps(state, indent=2) + '\n')
              summary = root / 'state.json'
              current = json.loads(summary.read_text(encoding='utf-8-sig'))
              current['preparation'] = state['state']
              summary.write_text(json.dumps(current, indent=2) + '\n')
          save()
          try:
              assert sys.version_info[:2] == (3, 12)
              (log / 'python.json').write_text(json.dumps({'version': sys.version, 'executable': sys.executable}, indent=2) + '\n')
              command = [sys.executable, '-m', 'pip', 'install', '--require-hashes', '--only-binary=:all:', '-r', str(pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'definition/tools/native-original-reply-observation/requirements.txt')]
              with (log / 'pip.stdout').open('wb') as stdout, (log / 'pip.stderr').open('wb') as stderr:
                  result = subprocess.run(command, stdout=stdout, stderr=stderr)
              state.update(returncode=result.returncode, state='READY' if result.returncode == 0 else 'PREPARATION_FAIL')
              save()
              if result.returncode != 0:
                  raise SystemExit(result.returncode)
              with (log / 'pip-list.stdout').open('wb') as stdout, (log / 'pip-list.stderr').open('wb') as stderr:
                  versions = subprocess.run([sys.executable, '-m', 'pip', 'list', '--format=json'], stdout=stdout, stderr=stderr)
              (log / 'pip-list.returncode').write_text(str(versions.returncode) + '\n')
              if versions.returncode != 0:
                  state.update(state='PREPARATION_FAIL')
                  raise SystemExit(versions.returncode)
          except BaseException as error:
              if state['state'] == 'RUNNING':
                  state.update(state='PREPARATION_FAIL')
              state['error'] = f'{type(error).__name__}: {error}'
              raise
          finally:
              save()
          PY
      - name: Run one bounded native synthetic observation
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess, sys
          root = pathlib.Path(os.environ['OBSERVATION_ROOT'])
          output = root / 'observation'
          assert not output.exists(), 'Native output must be fresh; never reuse or erase it'
          log = root / 'native'
          log.mkdir()
          windows = platform.system() == 'Windows'
          repo = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'definition'
          command = [shutil.which('dotnet'), str(root / 'bin/Debug/net8.0-windows/Observer.dll'), str(output)] if windows else [sys.executable, str(repo / 'tools/native-original-reply-observation/macos/wk_reply_probe.py'), str(output)]
          state = {'state': 'RUNNING', 'command': command, 'nativeProcessTimeoutSeconds': 180, 'productGreen': False, 'securityAcceptance': False, 'app': 'NOT_CHECKED'}
          receipt = log / 'status.json'
          def save():
              receipt.write_text(json.dumps(state, indent=2) + '\n')
              summary = root / 'state.json'
              current = json.loads(summary.read_text(encoding='utf-8-sig'))
              current['native'] = state['state']
              summary.write_text(json.dumps(current, indent=2) + '\n')
          save()
          status = 1
          try:
              with (log / 'stdout.log').open('wb') as stdout, (log / 'stderr.log').open('wb') as stderr:
                  child = subprocess.Popen(command, cwd=root, stdout=stdout, stderr=stderr)
                  state['pid'] = child.pid
                  save()
                  try:
                      code = child.wait(timeout=180)
                      state.update(returncode=code)
                      save()
                  except subprocess.TimeoutExpired:
                      child.kill()
                      state.update(state='TIMEOUT_FAIL', returncode=child.wait(), timeout=True)
                      raise
              result_path = output / 'result.json'
              raw = json.loads(result_path.read_text()) if result_path.is_file() else None
              state['rawResultPresent'] = raw is not None
              if code == 0 and raw and raw.get('status') == 'observed':
                  state.update(state='OBSERVED_ONLY_NOT_ACCEPTANCE')
                  status = 0
              else:
                  error = str(raw.get('error', '')) if raw else ''
                  unavailable = raw and (raw.get('status') == 'unavailable' or 'WebView2RuntimeNotFoundException' in error)
                  state.update(state='UNAVAILABLE' if unavailable else 'NATIVE_FAIL', rawStatus=raw.get('status') if raw else None)
          except BaseException as error:
              if state['state'] == 'RUNNING':
                  state.update(state='NATIVE_FAIL')
              state['collectorError'] = f'{type(error).__name__}: {error}'
          finally:
              save()
          raise SystemExit(status)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-original-reply-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/native-original-reply-macos
          if-no-files-found: error
  windows-observation:
    name: Required WebView2 native events; no original reply API
    needs: input-audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Reserve fresh synthetic observation root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'native-original-reply-windows'
          if (Test-Path -LiteralPath $root) { throw 'Synthetic root already exists; refusing reuse' }
          New-Item -ItemType Directory -Path $root | Out-Null
          "OBSERVATION_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          '{"preparation":"NOT_RUN","native":"NOT_RUN","productGreen":false,"securityAcceptance":false}' | Set-Content -LiteralPath (Join-Path $root 'state.json') -Encoding utf8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 9
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare pinned existing SDK inputs and preserve raw results
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil, subprocess
          root = pathlib.Path(os.environ['OBSERVATION_ROOT'])
          log = root / 'preparation'
          log.mkdir()
          state = {'state': 'RUNNING', 'native': 'NOT_RUN', 'productGreen': False}
          receipt = log / 'status.json'
          def save():
              receipt.write_text(json.dumps(state, indent=2) + '\n')
              summary = root / 'state.json'
              current = json.loads(summary.read_text(encoding='utf-8-sig'))
              current['preparation'] = state['state']
              summary.write_text(json.dumps(current, indent=2) + '\n')
          def unavailable(message):
              state.update(state='UNAVAILABLE', error=message)
              save()
              raise SystemExit(1)
          def run(label, command):
              item = {'state': 'RUNNING', 'command': command}
              target = log / (label + '.json')
              target.write_text(json.dumps(item, indent=2) + '\n')
              with (log / (label + '.stdout')).open('wb') as stdout, (log / (label + '.stderr')).open('wb') as stderr:
                  result = subprocess.run(command, cwd=root, stdout=stdout, stderr=stderr)
              item.update(state='SUCCEEDED' if result.returncode == 0 else 'FAILED', returncode=result.returncode)
              target.write_text(json.dumps(item, indent=2) + '\n')
              if result.returncode != 0:
                  raise SystemExit(result.returncode)
              return (log / (label + '.stdout')).read_text(errors='replace')
          save()
          try:
              os.environ['DOTNET_CLI_HOME'] = str(root / 'dotnet-home')
              os.environ['NUGET_PACKAGES'] = str(root / 'packages')
              os.environ['TEMP'] = str(root / 'temp')
              os.environ['TMP'] = os.environ['TEMP']
              (root / 'temp').mkdir()
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  for key in ('DOTNET_CLI_HOME', 'NUGET_PACKAGES', 'TEMP', 'TMP'):
                      env.write(key + '=' + os.environ[key] + '\n')
              dotnet = shutil.which('dotnet')
              if not dotnet:
                  unavailable('No installed dotnet host; no installation attempted')
              listing = run('installed-sdks', [dotnet, '--list-sdks'])
              sdks = re.findall(r'^(8\.0\.\d+)\s+\[([^\r\n]+)\]$', listing, re.MULTILINE)
              if not sdks:
                  unavailable('No installed stable .NET8 SDK; no installation attempted')
              version = max((version for version, _ in sdks), key=lambda v: tuple(map(int, v.split('.'))))
              (root / 'global.json').write_text(json.dumps({'sdk': {'version': version, 'rollForward': 'disable', 'allowPrerelease': False}}, indent=2) + '\n')
              actual = run('selected-sdk', [dotnet, '--version']).strip()
              if actual != version:
                  unavailable('Installed .NET8 SDK selection mismatch')
              runtimes = run('installed-runtimes', [dotnet, '--list-runtimes'])
              if not all(re.search(r'^' + re.escape(name) + r' 8\.0\.\d+ ', runtimes, re.MULTILINE) for name in ('Microsoft.NETCore.App', 'Microsoft.WindowsDesktop.App')):
                  unavailable('Installed .NET8 or WindowsDesktop runtime missing; no installation attempted')
              project = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'definition/tools/native-original-reply-observation/windows/Observer.csproj'
              intermediate = str(root / 'obj') + os.sep
              binary = str(root / 'bin') + os.sep
              run('restore', [dotnet, 'restore', str(project), '--locked-mode', '--packages', os.environ['NUGET_PACKAGES'], '-p:BaseIntermediateOutputPath=' + intermediate])
              run('build', [dotnet, 'build', str(project), '--no-restore', '-p:BaseIntermediateOutputPath=' + intermediate, '-p:BaseOutputPath=' + binary])
              state.update(state='READY', selectedSdk=version, dotnet=dotnet)
          except BaseException as error:
              if state['state'] == 'RUNNING':
                  state.update(state='PREPARATION_FAIL')
              state['error'] = f'{type(error).__name__}: {error}'
              raise
          finally:
              save()
          PY
      - name: Run one bounded native synthetic observation
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess, sys
          root = pathlib.Path(os.environ['OBSERVATION_ROOT'])
          output = root / 'observation'
          assert not output.exists(), 'Native output must be fresh; never reuse or erase it'
          log = root / 'native'
          log.mkdir()
          windows = platform.system() == 'Windows'
          repo = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'definition'
          command = [shutil.which('dotnet'), str(root / 'bin/Debug/net8.0-windows/Observer.dll'), str(output)] if windows else [sys.executable, str(repo / 'tools/native-original-reply-observation/macos/wk_reply_probe.py'), str(output)]
          state = {'state': 'RUNNING', 'command': command, 'nativeProcessTimeoutSeconds': 180, 'productGreen': False, 'securityAcceptance': False, 'app': 'NOT_CHECKED'}
          receipt = log / 'status.json'
          def save():
              receipt.write_text(json.dumps(state, indent=2) + '\n')
              summary = root / 'state.json'
              current = json.loads(summary.read_text(encoding='utf-8-sig'))
              current['native'] = state['state']
              summary.write_text(json.dumps(current, indent=2) + '\n')
          save()
          status = 1
          try:
              with (log / 'stdout.log').open('wb') as stdout, (log / 'stderr.log').open('wb') as stderr:
                  child = subprocess.Popen(command, cwd=root, stdout=stdout, stderr=stderr)
                  state['pid'] = child.pid
                  save()
                  try:
                      code = child.wait(timeout=180)
                      state.update(returncode=code)
                      save()
                  except subprocess.TimeoutExpired:
                      child.kill()
                      state.update(state='TIMEOUT_FAIL', returncode=child.wait(), timeout=True)
                      raise
              result_path = output / 'result.json'
              raw = json.loads(result_path.read_text()) if result_path.is_file() else None
              state['rawResultPresent'] = raw is not None
              if code == 0 and raw and raw.get('status') == 'observed':
                  state.update(state='OBSERVED_ONLY_NOT_ACCEPTANCE')
                  status = 0
              else:
                  error = str(raw.get('error', '')) if raw else ''
                  unavailable = raw and (raw.get('status') == 'unavailable' or 'WebView2RuntimeNotFoundException' in error)
                  state.update(state='UNAVAILABLE' if unavailable else 'NATIVE_FAIL', rawStatus=raw.get('status') if raw else None)
          except BaseException as error:
              if state['state'] == 'RUNNING':
                  state.update(state='NATIVE_FAIL')
              state['collectorError'] = f'{type(error).__name__}: {error}'
          finally:
              save()
          raise SystemExit(status)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-original-reply-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/native-original-reply-windows
          if-no-files-found: error
  definition-policy:
    name: Required genuine definition prepush, original full scope
    needs: input-audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: definition
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 9
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: definition/.nvmrc
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Bind original criterion and initialize policy receipt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whole-app-policy"
          printf 'PREPARATION/INPUT/BLOCKED\nprepush=NOT_RUN\nproductGreen=false\n' > "$RUNNER_TEMP/whole-app-policy/status.txt"
          test "$(git merge-base HEAD "$SOURCE_PARENT")" = "$SOURCE_PARENT"
          printf '%s  %s\n' 746d068d92907dea15376057a8523afeda36f0f29593a439137918855ccc22d5 tools/prepush.mjs | sha256sum -c -
          printf '%s  %s\n' f3a8f06da1371947aaef149e73d0810dd69fca94b760d3d8cca33d711e5c46f1 tools/build-rhwp-core.mjs | sha256sum -c -
          printf 'scope=%s\nhead=%s\npolicy_base=%s\n' 'definition' "$(git rev-parse HEAD)" "$SOURCE_PARENT" > "$RUNNER_TEMP/whole-app-policy/identity.txt"
      - name: Install exact actionlint for the canonical workflow check
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Preserve actual Cargo locks, input
        env:
          LOCK_STAGE: input
          LOCK_OUTPUT: ${{ runner.temp }}/whole-app-policy/locks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['LOCK_OUTPUT']) / os.environ['LOCK_STAGE']
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for relative in ('crates/Cargo.lock', 'crates/shell/Cargo.lock'):
              source = pathlib.Path(relative)
              record = {'path': relative, 'exists': source.is_file()}
              if source.is_file():
                  data = source.read_bytes()
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'lock-receipt.json').write_text(json.dumps(records, indent=2) + '\n')
          expected = {
              'crates/Cargo.lock': '416faccdcdba0612e2b1b6833b09871fdc10102d4b0a35ec33bb12c87069bb04',
              'crates/shell/Cargo.lock': 'ce74057ae77a5f395fde10eeb21e99da434c3947282e67457634022e0b8db9b3'}
          mismatches = [record for record in records
                        if not record['exists'] or record.get('sha256') != expected[record['path']]]
          guard = {'state': 'INPUT/FAIL' if mismatches else 'FROZEN_INPUT_UNCHANGED',
                   'stage': os.environ['LOCK_STAGE'], 'expected': expected, 'observed': records}
          (out / 'input-admission.json').write_text(json.dumps(guard, indent=2) + '\n')
          if mismatches:
              raise RuntimeError('frozen S5 lock input changed; raw bytes retained: ' + json.dumps(mismatches))
          PY
      - name: Canonical full-scope prepush prerequisites
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-policy/preparation/policy-prerequisites"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/whole-app-policy/npm-ci.log"
          node tools/build-rhwp-core.mjs --source-only 2>&1 | tee "$RUNNER_TEMP/whole-app-policy/rhwp-source.log"
          test -f crates/.rhwp-source/v0.9.0/Cargo.toml
          test "$(git -C crates/.rhwp-source/v0.9.0 rev-parse HEAD)" = c9095c5f67632e6721e800ccc7fb43ea49d26682
          actionlint -version
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Build the actual canonical WASM prerequisite for genuine prepush
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/whole-app-policy"
          status=0
          npm run build:wasm > "$out/build-wasm.stdout" 2> "$out/build-wasm.stderr" || status=$?
          cat "$out/build-wasm.stdout" "$out/build-wasm.stderr"
          printf '%s\n' "$status" > "$out/build-wasm-status.txt"
          exit "$status"
      - name: Run unchanged genuine prepush on the entire original delta
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/whole-app-policy"
          status=0
          node tools/prepush.mjs --base "$SOURCE_PARENT" > "$out/prepush.stdout" 2> "$out/prepush.stderr" || status=$?
          cat "$out/prepush.stdout" "$out/prepush.stderr"
          printf '%s\n' "$status" > "$out/prepush-status.txt"
          if [ "$status" -eq 0 ]; then
            printf 'POLICY/PASS\nproductGreen=false\nconsumer=NOT_RUN\n' > "$out/status.txt"
          else
            printf 'POLICY/FAIL\nproductGreen=false\nconsumer=NOT_RUN\n' > "$out/status.txt"
          fi
          exit "$status"
      - name: Preserve actual Cargo locks, after
        if: always()
        env:
          LOCK_STAGE: after
          LOCK_OUTPUT: ${{ runner.temp }}/whole-app-policy/locks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['LOCK_OUTPUT']) / os.environ['LOCK_STAGE']
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for relative in ('crates/Cargo.lock', 'crates/shell/Cargo.lock'):
              source = pathlib.Path(relative)
              record = {'path': relative, 'exists': source.is_file()}
              if source.is_file():
                  data = source.read_bytes()
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'lock-receipt.json').write_text(json.dumps(records, indent=2) + '\n')
          expected = {
              'crates/Cargo.lock': '416faccdcdba0612e2b1b6833b09871fdc10102d4b0a35ec33bb12c87069bb04',
              'crates/shell/Cargo.lock': 'ce74057ae77a5f395fde10eeb21e99da434c3947282e67457634022e0b8db9b3'}
          mismatches = [record for record in records
                        if not record['exists'] or record.get('sha256') != expected[record['path']]]
          guard = {'state': 'INPUT/FAIL' if mismatches else 'FROZEN_INPUT_UNCHANGED',
                   'stage': os.environ['LOCK_STAGE'], 'expected': expected, 'observed': records}
          (out / 'input-admission.json').write_text(json.dumps(guard, indent=2) + '\n')
          if mismatches:
              raise RuntimeError('frozen S5 lock input changed; raw bytes retained: ' + json.dumps(mismatches))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: whole-app-policy-definition-${{ github.run_id }}
          path: ${{ runner.temp }}/whole-app-policy
          if-no-files-found: error
