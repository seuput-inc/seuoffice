name: seuoffice rust - retained producer proof

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Exact product with opt-in per-mutation evidence producer
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: seuoffice-main-retained-producer-proof-${{ inputs.product_sha || github.ref }}
  cancel-in-progress: false

env:
  MODE: main-retained-producer-proof
  PRODUCT_DIR: ${{ github.workspace }}/product
  DRIVER_DIR: ${{ github.workspace }}/driver
  PRODUCT_SHA: ${{ inputs.product_sha }}
  DEFINITION_SHA: ${{ github.sha }}
  PLAN_PATH: ${{ github.workspace }}/retained-sensitivity-plan.json

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      product_sha: ${{ steps.identity.outputs.product_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact producer product input
        id: identity
        run: node driver/tools/main-diff/retained-sensitivity-driver.mjs validate
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.product_sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Bind product lineage and original mutation objects
        run: node driver/tools/main-diff/retained-sensitivity-driver.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: retained-sensitivity-plan
          path: retained-sensitivity-plan.json
          if-no-files-found: error

  sensitivity:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_OUT: ${{ github.workspace }}/job-out
      MAIN_DIFF_MUTATION_EVIDENCE_DIR: ${{ github.workspace }}/job-out/retained
      MAIN_DIFF_ADDON: ${{ github.workspace }}/job-out/main_node.node
      MAIN_DIFF_PROFILE: node-faults
      CARGO_INCREMENTAL: '1'
      SEUOFFICE_WASM: ${{ github.workspace }}/product/crates/target/wasm32-wasip1/release/office_wasm.wasm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.product_sha }}
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: retained-sensitivity-plan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/crates
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: product/crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('product/vendor/rhwp-core/**', 'product/tools/build-rhwp-core.mjs') }}
      - name: Product rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        working-directory: product
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Install exact product dependencies
        working-directory: product
        run: npm ci
      - name: Build exact product WASM
        working-directory: product
        run: npm run build:wasm
      - name: Normal selected consumer baseline
        env:
          CARGO_INCREMENTAL: '1'
        run: node driver/tools/main-diff/retained-sensitivity-driver.mjs baseline
      - name: Original residue with append-only producer evidence
        id: mutations
        working-directory: product
        env:
          CARGO_INCREMENTAL: '1'
          FAULT_SHARD: '41/56'
          FAULT_CATALOG: tools/main-diff/faults/b5-agent-apps.json
        shell: bash
        run: node tools/main-diff/faults.mjs "$FAULT_CATALOG" 2>&1 | tee "$JOB_OUT/faults.txt"
      - name: Preserve original producer result
        if: always()
        shell: bash
        run: |
          mkdir -p "$JOB_OUT"
          if [ -f product/tools/main-diff/out/faults.json ]; then
            cp product/tools/main-diff/out/faults.json "$JOB_OUT/faults.json"
          fi
      - name: Audit every retained original report and restoration
        if: ${{ success() }}
        env:
          CARGO_INCREMENTAL: '1'
          MUTATION_STATUS: ${{ steps.mutations.outcome }}
        run: node driver/tools/main-diff/retained-sensitivity-driver.mjs audit
      - name: Publish bounded proof or incomplete raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-producer-proof
          path: |
            job-out
            !job-out/*.node
            !job-out/retained/work
          if-no-files-found: error
