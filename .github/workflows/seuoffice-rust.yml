name: seuoffice dependency lock input preparation only
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact S3 dependency-input source, not app validation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rust-lock-input-only-${{ inputs.source_sha }}
  cancel-in-progress: false
env:
  SOURCE_SHA: fee354b3542ca3c46f52c66f9d3523fcfaca52af
  SOURCE_PARENT: 1e9d0ec1ad96c7862dec0ee1b3ec7d47f3148483
  SOURCE_ACTUAL_PARENT: a3494007c534d02bb5a976e52fb5153fc8dc4079
  MANIFEST_SHA256: 8a99b721887f576ac4fc071ca0bf27c8d1a78ae2b747d3bc78c12be8cc569472
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  input-audit:
    name: Exact whole source and separate definition audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Bind one exact requested input
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: test "$REQUESTED_SOURCE" = "$SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 4
          persist-credentials: false
      - name: Audit complete composed source snapshot and separate two-file definition
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input-audit"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          source = pathlib.Path('source')
          definition = pathlib.Path('definition')
          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          sha = os.environ['SOURCE_SHA']
          parent = os.environ['SOURCE_PARENT']
          assert git(source, 'rev-parse', 'HEAD').decode().strip() == sha
          assert git(source, 'rev-parse', 'HEAD^').decode().strip() == os.environ['SOURCE_ACTUAL_PARENT']
          assert git(source, 'merge-base', 'HEAD', parent).decode().strip() == parent
          assert git(definition, 'rev-parse', 'HEAD').decode().strip() == os.environ['GITHUB_SHA']
          assert git(definition, 'rev-parse', 'HEAD^').decode().strip() == sha
          manifest_path = definition / '.github/validation/rust-first-app-integration-manifest.json'
          data = manifest_path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ['MANIFEST_SHA256']
          manifest = json.loads(data)
          assert manifest['head'] == parent
          assert manifest['sourceParent'] == os.environ['SOURCE_ACTUAL_PARENT']
          assert manifest['composedFrom']['source'] == os.environ['SOURCE_ACTUAL_PARENT']
          assert manifest['composedFrom']['manifestSha256'] == '35033b24461c19e5ec095bd6e2d6318a61edfe6c4394847669493ce33fd2f511'
          delta = git(source, 'diff', '--name-only', '-z', os.environ['SOURCE_ACTUAL_PARENT'], 'HEAD').decode().split('\0')[:-1]
          assert len(delta) == 1 and set(delta) == set(manifest['composedFrom']['deltaPaths'])
          assert manifest['entryCount'] == 1487 and manifest['oldFailureRun'] == 43726069006
          entries = {entry['path']: entry for entry in manifest['entries']}
          changed = git(source, 'diff', '--name-only', '-z', parent, 'HEAD').decode().split('\0')[:-1]
          assert len(entries) == len(changed) == manifest['entryCount'] and set(changed) == set(entries)
          tree = {}
          for row in git(source, 'ls-tree', '-rz', 'HEAD').split(b'\0'):
              if row:
                  left, path = row.split(b'\t')
                  mode, kind, oid = left.decode().split()
                  tree[path.decode()] = (mode, kind, oid)
          blobs = deleted = 0
          for path, entry in entries.items():
              if entry['kind'] == 'delete':
                  assert path not in tree and not (source / path).exists(), path
                  deleted += 1
                  continue
              assert entry['kind'] == 'file', path
              mode, kind, oid = tree[path]
              expected_mode = '100755' if int(entry['mode'], 8) & 0o111 else '100644'
              assert kind == 'blob' and mode == expected_mode, path
              blob = git(source, 'cat-file', 'blob', oid)
              assert len(blob) == entry['size'] and hashlib.sha256(blob).hexdigest() == entry['sha256'], path
              assert (source / path).read_bytes() == blob, path
              blobs += 1
          assert blobs + deleted == manifest['entryCount']
          definition_paths = git(definition, 'diff', '--name-only', '-z', sha, 'HEAD').decode().split('\0')[:-1]
          assert len(definition_paths) == 2 and set(definition_paths) == {
              '.github/workflows/seuoffice-rust.yml',
              '.github/validation/rust-first-app-integration-manifest.json'}
          recipe = source / '.github/workflows/seuoffice-shell.yml'
          assert hashlib.sha256(recipe.read_bytes()).hexdigest() == entries['.github/workflows/seuoffice-shell.yml']['sha256']
          receipt = {'source': sha, 'frozenPolicyBase': parent, 'definition': os.environ['GITHUB_SHA'],
                     'sourceActualParent': os.environ['SOURCE_ACTUAL_PARENT'],
                     'manifestSha256': os.environ['MANIFEST_SHA256'], 'entryCount': manifest['entryCount'],
                     'blobs': blobs, 'deleted': deleted, 'definitionPaths': definition_paths,
                     'recipeSha256': hashlib.sha256(recipe.read_bytes()).hexdigest(),
                     'previousFailureRun': manifest['oldFailureRun'],
                     'previousManifestSha256': manifest['composedFrom']['manifestSha256'],
                     'sourceDeltaPaths': manifest['composedFrom']['deltaPaths'],
                     'purpose': 'INPUT/PREPARATION_ONLY', 'compile': 'NOT_RUN', 'tests': 'NOT_RUN',
                     'policy': 'NOT_RUN', 'consumer': 'NOT_RUN', 'productGreen': False}
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'input-audit'
          (out / 'input-binding.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (out / manifest_path.name).write_bytes(data)
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: whole-app-input-${{ github.run_id }}
          path: ${{ runner.temp }}/input-audit
          if-no-files-found: error
  linux-lock-inputs:
    name: INPUT ONLY, Linux actual dependency lock resolution
    needs: input-audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PREPARATION_RESULTS: ${{ runner.temp }}/dependency-linux
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Preserve exact S3 lock inputs before preparation
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['PREPARATION_RESULTS'])
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for relative in ('crates/Cargo.lock', 'crates/shell/Cargo.lock'):
              path = pathlib.Path(relative)
              record = {'path': relative, 'exists': path.is_file()}
              if path.is_file():
                  data = path.read_bytes()
                  target = out / 'before' / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'before-locks.json').write_text(json.dumps(records, indent=2) + '\n')
          state = {'purpose': 'INPUT/PREPARATION_ONLY', 'inputResult': 'NOT_RUN',
                   'source': os.environ['SOURCE_SHA'], 'compile': 'NOT_RUN', 'tests': 'NOT_RUN',
                   'policy': 'NOT_RUN', 'consumer': 'NOT_RUN', 'productGreen': False}
          (out / 'execution.json').write_text(json.dumps(state, indent=2) + '\n')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.nvmrc
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip1
      - name: Record actual Cargo and Rust identity
        run: |
          set -euo pipefail
          cargo -Vv > "$PREPARATION_RESULTS/cargo-identity.txt" 2>&1
          rustc -Vv > "$PREPARATION_RESULTS/rust-identity.txt" 2>&1
          cat "$PREPARATION_RESULTS/cargo-identity.txt" "$PREPARATION_RESULTS/rust-identity.txt"
      - name: Canonical npm installation, no app build
        run: |
          set -euo pipefail
          status=0
          npm ci --ignore-scripts > "$PREPARATION_RESULTS/npm-ci.stdout" 2> "$PREPARATION_RESULTS/npm-ci.stderr" || status=$?
          cat "$PREPARATION_RESULTS/npm-ci.stdout" "$PREPARATION_RESULTS/npm-ci.stderr"
          printf '%s\n' "$status" > "$PREPARATION_RESULTS/npm-ci-status.txt"
          exit "$status"
      - name: Canonical pinned RHWP source-only preparation
        run: |
          set -euo pipefail
          status=0
          node tools/build-rhwp-core.mjs --source-only > "$PREPARATION_RESULTS/rhwp.stdout" 2> "$PREPARATION_RESULTS/rhwp.stderr" || status=$?
          cat "$PREPARATION_RESULTS/rhwp.stdout" "$PREPARATION_RESULTS/rhwp.stderr"
          printf '%s\n' "$status" > "$PREPARATION_RESULTS/rhwp-status.txt"
          exit "$status"
      - name: Canonical pinned Tauri override before shell metadata
        run: |
          set -euo pipefail
          status=0
          bash crates/shell/ci/prepare-tauri-source.sh > "$PREPARATION_RESULTS/tauri.stdout" 2> "$PREPARATION_RESULTS/tauri.stderr" || status=$?
          cat "$PREPARATION_RESULTS/tauri.stdout" "$PREPARATION_RESULTS/tauri.stderr"
          printf '%s\n' "$status" > "$PREPARATION_RESULTS/tauri-status.txt"
          exit "$status"
      - name: Record actual pinned Tauri source, patch, archive and override
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          out = pathlib.Path(os.environ['PREPARATION_RESULTS']) / 'external-inputs'
          out.mkdir(parents=True, exist_ok=True)
          config = pathlib.Path('crates/shell/.cargo/config.toml')
          text = config.read_text()
          prefix = '[patch.crates-io.tauri]\npath = '
          assert text.startswith(prefix), 'canonical Tauri config shape changed'
          prepared = pathlib.Path(json.loads(text[len(prefix):]))
          assert (prepared / 'Cargo.toml').is_file(), 'prepared Tauri manifest missing'
          archive = prepared.parent.parent / 'tauri-3.0.0-alpha.6.crate'
          patch = pathlib.Path('crates/vendor/tauri-runtime-cef/tauri-source/0001-window-builder-runtime-access.patch')
          expected = {'tauri-3.0.0-alpha.6.crate': '4b0cad7bd420aa41bdf7beab9a95e02d83c4cab1cb6f7b94fe4fd1e0c605feaa',
                      patch.name: 'c8f75c9eb064541ea0e5f5d60d87b2c3dda2f53ec566a4509bd71e056927166e'}
          records = []
          for path in (archive, patch, config, prepared / 'Cargo.toml'):
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if path.name in expected:
                  assert digest == expected[path.name], str(path)
              name = 'override-config.toml' if path == config else 'prepared-Cargo.toml' if path == prepared / 'Cargo.toml' else path.name
              (out / name).write_bytes(data)
              records.append({'path': str(path), 'artifact': name, 'sha256': digest, 'size': len(data)})
          for relative, expected_hash in {
              'crates/shell/ci/prepare-tauri-source.sh': '1174321e6824bcdbda4205b2e0bb0a39b95f3d189b8f8870bcfd14bc3e88c271',
              'crates/vendor/tauri-runtime-cef/tauri-source/prepare.sh': '9c49f996c9ee81ec5de5d33a5217c37d57d65ebbfb2c7b2dfe7852bb176faf77'}.items():
              data = pathlib.Path(relative).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected_hash, relative
              records.append({'path': relative, 'sha256': expected_hash, 'size': len(data)})
          receipt = {'source': os.environ['SOURCE_SHA'], 'tauriVersion': '3.0.0-alpha.6',
                     'canonicalCommand': 'bash crates/shell/ci/prepare-tauri-source.sh',
                     'preparedSource': str(prepared), 'inputs': records,
                     'compile': 'NOT_RUN', 'tests': 'NOT_RUN', 'policy': 'NOT_RUN',
                     'consumer': 'NOT_RUN', 'productGreen': False}
          (out / 'tauri-preparation.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Record actual canonical RHWP and ordered patch inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['PREPARATION_RESULTS']) / 'external-inputs'
          manifest = pathlib.Path('vendor/rhwp-core/package.json')
          tool = pathlib.Path('tools/build-rhwp-core.mjs')
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == 'fab293a2e4695f82110444fbd15874ffad0180fdf81b998b670833f6a21e5bd6'
          assert hashlib.sha256(tool.read_bytes()).hexdigest() == '8ee967e10d3f848a3d68d1a22a5bef5220c1a2de02bac20fa5813f8b075aa2ee'
          pins = json.loads(manifest.read_bytes())['rhwp']
          prepared = pathlib.Path('crates/.rhwp-source') / pins['tag']
          head = subprocess.check_output(['git', '-C', str(prepared), 'rev-parse', 'HEAD'], text=True).strip()
          assert head == pins['commit'] == 'c9095c5f67632e6721e800ccc7fb43ea49d26682'
          patches = []
          for name in pins['patches']:
              path = pathlib.Path('vendor/rhwp-core/patches') / name
              patches.append({'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'size': path.stat().st_size})
          diff = subprocess.check_output(['git', '-C', str(prepared), 'diff', '--binary'])
          (out / 'rhwp-applied.patch').write_bytes(diff)
          (out / 'rhwp-package.json').write_bytes(manifest.read_bytes())
          receipt = {'source': os.environ['SOURCE_SHA'], 'pins': pins, 'actualHead': head,
                     'orderedPatches': patches, 'appliedDiffSha256': hashlib.sha256(diff).hexdigest(),
                     'canonicalCommand': 'node tools/build-rhwp-core.mjs --source-only'}
          (out / 'rhwp-preparation.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Resolve both real workspaces using existing locks, without compiling
        id: metadata
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['PREPARATION_RESULTS'])
          command = ['cargo', 'metadata', '--format-version', '1']
          records = []
          for label, relative in (('crates', 'crates'), ('shell', 'crates/shell')):
              cwd = pathlib.Path(relative).resolve()
              target = out / label
              target.mkdir(parents=True, exist_ok=True)
              with (target / 'metadata.json').open('wb') as stdout, (target / 'metadata.stderr').open('wb') as stderr:
                  result = subprocess.run(command, cwd=cwd, stdout=stdout, stderr=stderr)
              error = (target / 'metadata.stderr').read_bytes()
              sys.stderr.buffer.write(error)
              sys.stderr.buffer.flush()
              (target / 'status.txt').write_text(str(result.returncode) + '\n')
              records.append({'workspace': relative, 'cwd': str(cwd), 'command': command,
                              'returncode': result.returncode,
                              'metadataSha256': hashlib.sha256((target / 'metadata.json').read_bytes()).hexdigest(),
                              'stderrSha256': hashlib.sha256(error).hexdigest()})
          failed = any(record['returncode'] != 0 for record in records)
          state = {'purpose': 'INPUT/PREPARATION_ONLY', 'source': os.environ['SOURCE_SHA'],
                   'inputResult': 'FAIL' if failed else 'LOCK_INPUTS_PRODUCED', 'metadata': records,
                   'compile': 'NOT_RUN', 'tests': 'NOT_RUN', 'policy': 'NOT_RUN',
                   'consumer': 'NOT_RUN', 'productGreen': False}
          (out / 'execution.json').write_text(json.dumps(state, indent=2) + '\n')
          sys.exit(1 if failed else 0)
          PY
      - name: Preserve actual resulting locks even on preparation failure
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['PREPARATION_RESULTS'])
          out.mkdir(parents=True, exist_ok=True)
          records = []
          locks = ('crates/Cargo.lock', 'crates/shell/Cargo.lock')
          for relative in locks:
              path = pathlib.Path(relative)
              record = {'path': relative, 'exists': path.is_file()}
              if path.is_file():
                  data = path.read_bytes()
                  target = out / 'after' / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'after-locks.json').write_text(json.dumps(records, indent=2) + '\n')
          diff = subprocess.check_output(['git', 'diff', '--binary', '--', *locks])
          (out / 'actual-lock-changes.patch').write_bytes(diff)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-inputs-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/dependency-linux
          if-no-files-found: error
  windows-tauri-preparation:
    name: INPUT ONLY, Windows canonical Tauri preparation
    needs: input-audit
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PREPARATION_RESULTS: ${{ runner.temp }}/dependency-windows
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Initialize preparation-only receipt
        run: |
          set -euo pipefail
          mkdir -p "$PREPARATION_RESULTS"
          printf 'purpose=INPUT/PREPARATION_ONLY\ncompile=NOT_RUN\ntests=NOT_RUN\npolicy=NOT_RUN\nconsumer=NOT_RUN\nproductGreen=false\n' > "$PREPARATION_RESULTS/execution.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Actual canonical Tauri archive hash, patch, extraction and config preparation
        run: |
          set -euo pipefail
          status=0
          bash crates/shell/ci/prepare-tauri-source.sh > "$PREPARATION_RESULTS/tauri.stdout" 2> "$PREPARATION_RESULTS/tauri.stderr" || status=$?
          cat "$PREPARATION_RESULTS/tauri.stdout" "$PREPARATION_RESULTS/tauri.stderr"
          printf '%s\n' "$status" > "$PREPARATION_RESULTS/tauri-status.txt"
          exit "$status"
      - name: Record actual pinned Tauri source, patch, archive and override
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          out = pathlib.Path(os.environ['PREPARATION_RESULTS']) / 'external-inputs'
          out.mkdir(parents=True, exist_ok=True)
          config = pathlib.Path('crates/shell/.cargo/config.toml')
          text = config.read_text()
          prefix = '[patch.crates-io.tauri]\npath = '
          assert text.startswith(prefix), 'canonical Tauri config shape changed'
          prepared = pathlib.Path(json.loads(text[len(prefix):]))
          assert (prepared / 'Cargo.toml').is_file(), 'prepared Tauri manifest missing'
          archive = prepared.parent.parent / 'tauri-3.0.0-alpha.6.crate'
          patch = pathlib.Path('crates/vendor/tauri-runtime-cef/tauri-source/0001-window-builder-runtime-access.patch')
          expected = {'tauri-3.0.0-alpha.6.crate': '4b0cad7bd420aa41bdf7beab9a95e02d83c4cab1cb6f7b94fe4fd1e0c605feaa',
                      patch.name: 'c8f75c9eb064541ea0e5f5d60d87b2c3dda2f53ec566a4509bd71e056927166e'}
          records = []
          for path in (archive, patch, config, prepared / 'Cargo.toml'):
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if path.name in expected:
                  assert digest == expected[path.name], str(path)
              name = 'override-config.toml' if path == config else 'prepared-Cargo.toml' if path == prepared / 'Cargo.toml' else path.name
              (out / name).write_bytes(data)
              records.append({'path': str(path), 'artifact': name, 'sha256': digest, 'size': len(data)})
          for relative, expected_hash in {
              'crates/shell/ci/prepare-tauri-source.sh': '1174321e6824bcdbda4205b2e0bb0a39b95f3d189b8f8870bcfd14bc3e88c271',
              'crates/vendor/tauri-runtime-cef/tauri-source/prepare.sh': '9c49f996c9ee81ec5de5d33a5217c37d57d65ebbfb2c7b2dfe7852bb176faf77'}.items():
              data = pathlib.Path(relative).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected_hash, relative
              records.append({'path': relative, 'sha256': expected_hash, 'size': len(data)})
          receipt = {'source': os.environ['SOURCE_SHA'], 'tauriVersion': '3.0.0-alpha.6',
                     'canonicalCommand': 'bash crates/shell/ci/prepare-tauri-source.sh',
                     'preparedSource': str(prepared), 'inputs': records,
                     'compile': 'NOT_RUN', 'tests': 'NOT_RUN', 'policy': 'NOT_RUN',
                     'consumer': 'NOT_RUN', 'productGreen': False}
          (out / 'tauri-preparation.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-inputs-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/dependency-windows
          if-no-files-found: error
