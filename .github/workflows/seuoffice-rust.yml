name: seuoffice whole Rust app compile diagnosis
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact whole integration snapshot, validation only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rust-first-app-input-${{ inputs.source_sha }}
  cancel-in-progress: false
env:
  SOURCE_SHA: dc1bb9eac8965bb726a4de04d2ee449d5a6c4517
  SOURCE_PARENT: 1e9d0ec1ad96c7862dec0ee1b3ec7d47f3148483
  MANIFEST_SHA256: a6dfe60d8393410eab529eed7f7412c092e6ab742e61267ce5b8d558c2a5f308
  CEF_CRATE_VERSION: '154.5.0'
  CEF_VERSION: '154.0.34'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  input-audit:
    name: Exact whole source and separate definition audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Bind one exact requested input
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: test "$REQUESTED_SOURCE" = "$SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Audit complete 1485-path snapshot and two-file definition
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input-audit"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          source = pathlib.Path('source')
          definition = pathlib.Path('definition')
          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          sha = os.environ['SOURCE_SHA']
          parent = os.environ['SOURCE_PARENT']
          assert git(source, 'rev-parse', 'HEAD').decode().strip() == sha
          assert git(source, 'rev-parse', 'HEAD^').decode().strip() == parent
          assert git(definition, 'rev-parse', 'HEAD').decode().strip() == os.environ['GITHUB_SHA']
          assert git(definition, 'rev-parse', 'HEAD^').decode().strip() == sha
          manifest_path = definition / '.github/validation/rust-first-app-integration-manifest.json'
          data = manifest_path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ['MANIFEST_SHA256']
          manifest = json.loads(data)
          assert manifest['head'] == parent and manifest['entryCount'] == 1485
          entries = {entry['path']: entry for entry in manifest['entries']}
          changed = git(source, 'diff', '--name-only', '-z', parent, 'HEAD').decode().split('\0')[:-1]
          assert len(entries) == len(changed) == 1485 and set(changed) == set(entries)
          tree = {}
          for row in git(source, 'ls-tree', '-rz', 'HEAD').split(b'\0'):
              if row:
                  left, path = row.split(b'\t')
                  mode, kind, oid = left.decode().split()
                  tree[path.decode()] = (mode, kind, oid)
          blobs = deleted = 0
          for path, entry in entries.items():
              if entry['kind'] == 'delete':
                  assert path not in tree and not (source / path).exists(), path
                  deleted += 1
                  continue
              assert entry['kind'] == 'file', path
              mode, kind, oid = tree[path]
              expected_mode = '100755' if int(entry['mode'], 8) & 0o111 else '100644'
              assert kind == 'blob' and mode == expected_mode, path
              blob = git(source, 'cat-file', 'blob', oid)
              assert len(blob) == entry['size'] and hashlib.sha256(blob).hexdigest() == entry['sha256'], path
              assert (source / path).read_bytes() == blob, path
              blobs += 1
          assert (blobs, deleted) == (1484, 1)
          definition_paths = git(definition, 'diff', '--name-only', '-z', sha, 'HEAD').decode().split('\0')[:-1]
          assert len(definition_paths) == 2 and set(definition_paths) == {
              '.github/workflows/seuoffice-rust.yml',
              '.github/validation/rust-first-app-integration-manifest.json'}
          recipe = source / '.github/workflows/seuoffice-shell.yml'
          assert hashlib.sha256(recipe.read_bytes()).hexdigest() == entries['.github/workflows/seuoffice-shell.yml']['sha256']
          receipt = {'source': sha, 'sourceParent': parent, 'definition': os.environ['GITHUB_SHA'],
                     'manifestSha256': os.environ['MANIFEST_SHA256'], 'entryCount': 1485,
                     'blobs': blobs, 'deleted': deleted, 'definitionPaths': definition_paths,
                     'recipeSha256': hashlib.sha256(recipe.read_bytes()).hexdigest(),
                     'compile': 'NOT_RUN', 'consumer': 'NOT_RUN', 'productGreen': False}
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'input-audit'
          (out / 'input-binding.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (out / manifest_path.name).write_bytes(data)
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: whole-app-input-${{ github.run_id }}
          path: ${{ runner.temp }}/input-audit
          if-no-files-found: error
  format:
    name: Required format, independent of compile
    needs: input-audit
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: source/crates/shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Actual whole shell format result
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whole-app-format"
          status=0
          cargo fmt --all -- --check > "$RUNNER_TEMP/whole-app-format/fmt.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/whole-app-format/fmt.log"
          printf '%s\n' "$status" > "$RUNNER_TEMP/whole-app-format/status.txt"
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: whole-app-format-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/whole-app-format
          if-no-files-found: error
  whole-shell-check:
    name: Required entire shell all-targets check
    needs: input-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          persist-credentials: false
      - name: Initialize honest execution states and bind checkout bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whole-app-check"
          printf 'INPUT/BLOCKED\ncompile=NOT_RUN\nconsumer=NOT_RUN\n' > "$RUNNER_TEMP/whole-app-check/status.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          data = pathlib.Path('../definition/.github/validation/rust-first-app-integration-manifest.json').read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ['MANIFEST_SHA256']
          for entry in json.loads(data)['entries']:
              path = pathlib.Path(entry['path'])
              if entry['kind'] == 'delete':
                  assert not path.exists(), entry['path']
              else:
                  blob = path.read_bytes()
                  assert len(blob) == entry['size'] and hashlib.sha256(blob).hexdigest() == entry['sha256'], entry['path']
          PY
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: clippy
          targets: wasm32-wasip1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.nvmrc
      - name: npm ci, real workspace and preload dependencies
        run: npm ci --ignore-scripts
      - name: Complete pinned rhwp source and patch preparation
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Prepare pinned Tauri window lifetime source
        run: bash crates/shell/ci/prepare-tauri-source.sh
      - name: Cheap actual Cargo manifest preflight after canonical source preparation, before CEF
        id: preflight
        working-directory: source/crates/shell
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/whole-app-check"
          status=0
          cargo metadata --no-deps --format-version 1 > "$out/metadata.json" 2> "$out/metadata.stderr" || status=$?
          cat "$out/metadata.stderr"
          printf '%s\n' "$status" > "$out/metadata-status.txt"
          if [ "$status" -ne 0 ]; then
            actual_status=0
            cargo check --all-targets > "$out/check-input.stdout" 2> "$out/check-input.stderr" || actual_status=$?
            cat "$out/check-input.stdout" "$out/check-input.stderr"
            printf '%s\n' "$actual_status" > "$out/check-input-status.txt"
            clippy_status=0
            cargo clippy --all-targets -- -D warnings > "$out/clippy-input.stdout" 2> "$out/clippy-input.stderr" || clippy_status=$?
            cat "$out/clippy-input.stdout" "$out/clippy-input.stderr"
            printf '%s\n' "$clippy_status" > "$out/clippy-input-status.txt"
            printf 'MANIFEST/INPUT/BLOCKED\ncompile=NOT_RUN\nclippy=NOT_RUN\nconsumer=NOT_RUN\n' > "$out/status.txt"
            exit "$status"
          fi
          printf 'INPUT_ACCEPTED\ncompile=NOT_RUN\nclippy=NOT_RUN\nconsumer=NOT_RUN\n' > "$out/status.txt"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: source/crates/shell
          cache-on-failure: true
      - name: CEF path
        run: echo "CEF_PATH=${USERPROFILE:-$HOME}/.cache/tauri-cef" >> "$GITHUB_ENV"
      - name: restore the CEF cache
        id: cef-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/tauri-cef
          key: shell-cef-${{ runner.os }}-${{ runner.arch }}-${{ env.CEF_CRATE_VERSION }}
      - name: tools
        run: |
          cmake --version
          if ! ninja --version; then
            if [ '${{ matrix.platform }}' = mac ]; then brew install ninja; else choco install ninja -y; fi
          fi
          rustc --version
          cargo --version
      - name: document engine
        run: npm run build:wasm
      - name: preloads
        run: node crates/shell/bridge/preloads.mjs
      - name: engine host
        run: node crates/shell/engine-host/build.mjs
      - name: native helpers, macOS
        if: matrix.platform == 'mac'
        run: |
          npm run native:build -w @seuoffice/sheets
          swiftc -O packages/pdf2docx/ocr-helper/vision-ocr.swift -o packages/pdf2docx/ocr-helper/vision-ocr
      - name: native helpers, Windows
        if: matrix.platform == 'win'
        run: |
          npm run native:build -w @seuoffice/sheets
          node packages/pdf2docx/ocr-helper/build-win.mjs
          node apps/shell/src/main/quick-look/build-win.mjs
      - name: Require actual prepared resources before compile
        run: |
          set -euo pipefail
          test -s crates/shell/frontend/index.html
          test -s crates/shell/out/preloads/manifest.json
          test -s crates/shell/out/engine-host/index.html
          test -s crates/shell/out/engine-host/docs-vendor/rhwp.wasm
          test -s crates/shell/out/engine-host/docs-vendor/office.wasm
          test -s crates/shell/out/engine-host/pdf/pdfium.wasm
          test -s crates/shell/out/engine-host/pdf/qpdf.wasm
          if [ '${{ matrix.platform }}' = mac ]; then
            test -s apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar
            test -s packages/pdf2docx/ocr-helper/vision-ocr
          else
            test -s apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar.exe
            test -s packages/pdf2docx/ocr-helper/win-ocr.exe
            test -s apps/shell/src/main/quick-look/win-quicklook.exe
          fi
      - name: Actual entire shell check and clippy with real CEF source and resources
        id: compile
        working-directory: source/crates/shell
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/whole-app-check"
          python3 ci/cef-index-mirror.py 8099 "$CEF_VERSION" > "$out/cef-mirror.log" 2>&1 &
          mirror=$!
          trap 'kill "$mirror" 2>/dev/null || true' EXIT
          for _ in $(seq 1 90); do curl -sf http://127.0.0.1:8099/index.json -o /dev/null && break; sleep 1; done
          cat "$out/cef-mirror.log"
          export CEF_DOWNLOAD_URL=http://127.0.0.1:8099
          printf 'COMPILE/RUNNING\nconsumer=NOT_RUN\n' > "$out/status.txt"
          check_status=0
          cargo check --all-targets > "$out/cargo-check.stdout" 2> "$out/cargo-check.stderr" || check_status=$?
          cat "$out/cargo-check.stdout" "$out/cargo-check.stderr"
          printf '%s\n' "$check_status" > "$out/cargo-check-status.txt"
          clippy_status=0
          cargo clippy --all-targets -- -D warnings > "$out/cargo-clippy.stdout" 2> "$out/cargo-clippy.stderr" || clippy_status=$?
          cat "$out/cargo-clippy.stdout" "$out/cargo-clippy.stderr"
          printf '%s\n' "$clippy_status" > "$out/cargo-clippy-status.txt"
          if [ "$check_status" -ne 0 ] || [ "$clippy_status" -ne 0 ]; then
            printf 'COMPILE_OR_CLIPPY/FAIL\nconsumer=NOT_RUN\nproductGreen=false\n' > "$out/status.txt"
            exit 1
          fi
          printf 'COMPILE_AND_CLIPPY/PASS\nconsumer=NOT_RUN\nproductGreen=false\n' > "$out/status.txt"
      - name: Record non-executed compile honestly
        if: always() && steps.compile.outcome == 'skipped'
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/whole-app-check"
          if [ "$PREFLIGHT_OUTCOME" = failure ]; then
            printf 'MANIFEST/INPUT/BLOCKED\ncompile=NOT_RUN\nclippy=NOT_RUN\nconsumer=NOT_RUN\n' > "$RUNNER_TEMP/whole-app-check/status.txt"
          else
            printf 'PREPARATION/INPUT/BLOCKED\ncompile=NOT_RUN\nclippy=NOT_RUN\nconsumer=NOT_RUN\n' > "$RUNNER_TEMP/whole-app-check/status.txt"
          fi
      - name: save the CEF cache
        if: always() && steps.cef-cache.outcome == 'success' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/tauri-cef
          key: shell-cef-${{ runner.os }}-${{ runner.arch }}-${{ env.CEF_CRATE_VERSION }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: whole-app-check-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/whole-app-check
            source/crates/shell/out/preloads/manifest.json
          if-no-files-found: error
  genuine-policy:
    name: Required unchanged prepush, original full scope
    needs: input-audit
    strategy:
      fail-fast: false
      matrix:
        scope: [source, definition]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.nvmrc
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Bind original criterion and initialize policy receipt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whole-app-policy"
          printf 'PREPARATION/INPUT/BLOCKED\nprepush=NOT_RUN\nproductGreen=false\n' > "$RUNNER_TEMP/whole-app-policy/status.txt"
          test "$(git merge-base HEAD "$SOURCE_PARENT")" = "$SOURCE_PARENT"
          printf '%s  %s\n' 64c82ffe03995e6a518998c90ae354920473d48e0f35caaa01afadd5b938c4d6 tools/prepush.mjs | sha256sum -c -
          printf '%s  %s\n' 8ee967e10d3f848a3d68d1a22a5bef5220c1a2de02bac20fa5813f8b075aa2ee tools/build-rhwp-core.mjs | sha256sum -c -
          printf 'scope=%s\nhead=%s\npolicy_base=%s\n' '${{ matrix.scope }}' "$(git rev-parse HEAD)" "$SOURCE_PARENT" > "$RUNNER_TEMP/whole-app-policy/identity.txt"
      - name: Install exact actionlint for the canonical workflow check
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Canonical full-scope prepush prerequisites
        run: |
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/whole-app-policy/npm-ci.log"
          node tools/build-rhwp-core.mjs --source-only 2>&1 | tee "$RUNNER_TEMP/whole-app-policy/rhwp-source.log"
          test -f crates/.rhwp-source/v0.9.0/Cargo.toml
          test "$(git -C crates/.rhwp-source/v0.9.0 rev-parse HEAD)" = c9095c5f67632e6721e800ccc7fb43ea49d26682
          actionlint -version
      - name: Run unchanged genuine prepush on the entire original delta
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/whole-app-policy"
          status=0
          node tools/prepush.mjs --base "$SOURCE_PARENT" > "$out/prepush.stdout" 2> "$out/prepush.stderr" || status=$?
          cat "$out/prepush.stdout" "$out/prepush.stderr"
          printf '%s\n' "$status" > "$out/prepush-status.txt"
          if [ "$status" -eq 0 ]; then
            printf 'POLICY/PASS\nproductGreen=false\nconsumer=NOT_RUN\n' > "$out/status.txt"
          else
            printf 'POLICY/FAIL\nproductGreen=false\nconsumer=NOT_RUN\n' > "$out/status.txt"
          fi
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: whole-app-policy-${{ matrix.scope }}-${{ github.run_id }}
          path: ${{ runner.temp }}/whole-app-policy
          if-no-files-found: error
