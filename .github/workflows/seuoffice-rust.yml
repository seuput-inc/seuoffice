name: seuoffice whole Rust app compile diagnosis
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact whole integration snapshot, validation only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rust-first-app-input-${{ inputs.source_sha }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 3bde25bfd039509b7bc8ef594e5f1a37b57ec6d8
  SOURCE_PARENT: 1e9d0ec1ad96c7862dec0ee1b3ec7d47f3148483
  SOURCE_ACTUAL_PARENT: fee354b3542ca3c46f52c66f9d3523fcfaca52af
  MANIFEST_SHA256: f9e639d47c0024c340670f36e5de2bcc5a843c4fdb19a83757c2e4735dc928fb
  CEF_CRATE_VERSION: '154.5.0'
  CEF_VERSION: '154.0.34'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  input-audit:
    name: Exact whole source and separate definition audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Bind one exact requested input
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: test "$REQUESTED_SOURCE" = "$SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 5
          persist-credentials: false
      - name: Audit complete composed source snapshot and separate two-file definition
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input-audit"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          source = pathlib.Path('source')
          definition = pathlib.Path('definition')
          def git(root, *args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          sha = os.environ['SOURCE_SHA']
          parent = os.environ['SOURCE_PARENT']
          assert git(source, 'rev-parse', 'HEAD').decode().strip() == sha
          assert git(source, 'rev-parse', 'HEAD^').decode().strip() == os.environ['SOURCE_ACTUAL_PARENT']
          assert git(source, 'merge-base', 'HEAD', parent).decode().strip() == parent
          assert git(definition, 'rev-parse', 'HEAD').decode().strip() == os.environ['GITHUB_SHA']
          assert git(definition, 'rev-parse', 'HEAD^').decode().strip() == sha
          manifest_path = definition / '.github/validation/rust-first-app-integration-manifest.json'
          data = manifest_path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ['MANIFEST_SHA256']
          manifest = json.loads(data)
          assert manifest['head'] == parent
          assert manifest['sourceParent'] == os.environ['SOURCE_ACTUAL_PARENT']
          assert manifest['composedFrom']['source'] == os.environ['SOURCE_ACTUAL_PARENT']
          assert manifest['composedFrom']['manifestSha256'] == '8a99b721887f576ac4fc071ca0bf27c8d1a78ae2b747d3bc78c12be8cc569472'
          delta = git(source, 'diff', '--name-only', '-z', os.environ['SOURCE_ACTUAL_PARENT'], 'HEAD').decode().split('\0')[:-1]
          assert len(delta) == 214 and set(delta) == set(manifest['composedFrom']['deltaPaths'])
          assert manifest['entryCount'] == 1528 and manifest['oldFailureRun'] == 43730943400
          entries = {entry['path']: entry for entry in manifest['entries']}
          changed = git(source, 'diff', '--name-only', '-z', parent, 'HEAD').decode().split('\0')[:-1]
          assert len(entries) == len(changed) == manifest['entryCount'] and set(changed) == set(entries)
          tree = {}
          for row in git(source, 'ls-tree', '-rz', 'HEAD').split(b'\0'):
              if row:
                  left, path = row.split(b'\t')
                  mode, kind, oid = left.decode().split()
                  tree[path.decode()] = (mode, kind, oid)
          blobs = deleted = 0
          for path, entry in entries.items():
              if entry['kind'] == 'delete':
                  assert path not in tree and not (source / path).exists(), path
                  deleted += 1
                  continue
              assert entry['kind'] == 'file', path
              mode, kind, oid = tree[path]
              expected_mode = '100755' if int(entry['mode'], 8) & 0o111 else '100644'
              assert kind == 'blob' and mode == expected_mode, path
              blob = git(source, 'cat-file', 'blob', oid)
              assert len(blob) == entry['size'] and hashlib.sha256(blob).hexdigest() == entry['sha256'], path
              assert (source / path).read_bytes() == blob, path
              blobs += 1
          assert blobs + deleted == manifest['entryCount']
          definition_paths = git(definition, 'diff', '--name-only', '-z', sha, 'HEAD').decode().split('\0')[:-1]
          assert len(definition_paths) == 2 and set(definition_paths) == {
              '.github/workflows/seuoffice-rust.yml',
              '.github/validation/rust-first-app-integration-manifest.json'}
          recipe = source / '.github/workflows/seuoffice-shell.yml'
          assert hashlib.sha256(recipe.read_bytes()).hexdigest() == entries['.github/workflows/seuoffice-shell.yml']['sha256']
          receipt = {'source': sha, 'frozenPolicyBase': parent, 'definition': os.environ['GITHUB_SHA'],
                     'sourceActualParent': os.environ['SOURCE_ACTUAL_PARENT'],
                     'manifestSha256': os.environ['MANIFEST_SHA256'], 'entryCount': manifest['entryCount'],
                     'blobs': blobs, 'deleted': deleted, 'definitionPaths': definition_paths,
                     'recipeSha256': hashlib.sha256(recipe.read_bytes()).hexdigest(),
                     'previousFailureRun': manifest['oldFailureRun'],
                     'previousManifestSha256': manifest['composedFrom']['manifestSha256'],
                     'sourceDeltaPaths': manifest['composedFrom']['deltaPaths'],
                     'compile': 'NOT_RUN', 'consumerTests': 'NOT_RUN', 'appRuntime': 'NOT_RUN',
                     'nativeRestorationGrant': manifest['privateGeneratedRestorationGrant'],
                     'nativeUi': 'BLOCKED', 'productGreen': False}
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'input-audit'
          (out / 'input-binding.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (out / manifest_path.name).write_bytes(data)
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: whole-app-input-${{ github.run_id }}
          path: ${{ runner.temp }}/input-audit
          if-no-files-found: error
  format:
    name: Required format, independent of compile
    needs: input-audit
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: source/crates/shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Preserve actual Cargo locks, input
        working-directory: source
        env:
          LOCK_STAGE: input
          LOCK_OUTPUT: ${{ runner.temp }}/whole-app-format/locks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['LOCK_OUTPUT']) / os.environ['LOCK_STAGE']
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for relative in ('crates/Cargo.lock', 'crates/shell/Cargo.lock'):
              source = pathlib.Path(relative)
              record = {'path': relative, 'exists': source.is_file()}
              if source.is_file():
                  data = source.read_bytes()
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'lock-receipt.json').write_text(json.dumps(records, indent=2) + '\n')
          expected = {
              'crates/Cargo.lock': '416faccdcdba0612e2b1b6833b09871fdc10102d4b0a35ec33bb12c87069bb04',
              'crates/shell/Cargo.lock': 'ce74057ae77a5f395fde10eeb21e99da434c3947282e67457634022e0b8db9b3'}
          mismatches = [record for record in records
                        if not record['exists'] or record.get('sha256') != expected[record['path']]]
          guard = {'state': 'INPUT/FAIL' if mismatches else 'FROZEN_INPUT_UNCHANGED',
                   'stage': os.environ['LOCK_STAGE'], 'expected': expected, 'observed': records}
          (out / 'input-admission.json').write_text(json.dumps(guard, indent=2) + '\n')
          if mismatches:
              raise RuntimeError('frozen S4 lock input changed; raw bytes retained: ' + json.dumps(mismatches))
          PY
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.nvmrc
      - name: Canonical format source prerequisites
        working-directory: source
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-format/preparation/format-source"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          set -euo pipefail
          npm ci --ignore-scripts
          node tools/build-rhwp-core.mjs --source-only
          bash crates/shell/ci/prepare-tauri-source.sh
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Actual whole root and shell format result
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'whole-app-format'
          out.mkdir(parents=True, exist_ok=True)
          records = []
          (out / 'before-format.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          for label, relative in (('root', 'crates'), ('shell', 'crates/shell')):
              command = ['cargo', 'fmt', '--all', '--', '--check']
              target = out / label
              target.mkdir(parents=True, exist_ok=True)
              with (target / 'fmt.stdout').open('wb') as stdout, (target / 'fmt.stderr').open('wb') as stderr:
                  result = subprocess.run(command, cwd=relative, stdout=stdout, stderr=stderr)
              (target / 'status.txt').write_text(str(result.returncode) + '\n')
              records.append({'workspace': relative, 'command': command, 'returncode': result.returncode})
          failed = any(record['returncode'] != 0 for record in records)
          if failed:
              for label, relative in (('root', 'crates'), ('shell', 'crates/shell')):
                  with (out / label / 'format-for-patch.stdout').open('wb') as stdout, (out / label / 'format-for-patch.stderr').open('wb') as stderr:
                      result = subprocess.run(['cargo', 'fmt', '--all'], cwd=relative, stdout=stdout, stderr=stderr)
                  (out / label / 'format-for-patch-status.txt').write_text(str(result.returncode) + '\n')
              (out / 'rustfmt.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          (out / 'fmt-check-results.json').write_text(json.dumps(records, indent=2) + '\n')
          sys.exit(1 if failed else 0)
          PY
      - name: Preserve actual Cargo locks, after
        if: always()
        working-directory: source
        env:
          LOCK_STAGE: after
          LOCK_OUTPUT: ${{ runner.temp }}/whole-app-format/locks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['LOCK_OUTPUT']) / os.environ['LOCK_STAGE']
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for relative in ('crates/Cargo.lock', 'crates/shell/Cargo.lock'):
              source = pathlib.Path(relative)
              record = {'path': relative, 'exists': source.is_file()}
              if source.is_file():
                  data = source.read_bytes()
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'lock-receipt.json').write_text(json.dumps(records, indent=2) + '\n')
          expected = {
              'crates/Cargo.lock': '416faccdcdba0612e2b1b6833b09871fdc10102d4b0a35ec33bb12c87069bb04',
              'crates/shell/Cargo.lock': 'ce74057ae77a5f395fde10eeb21e99da434c3947282e67457634022e0b8db9b3'}
          mismatches = [record for record in records
                        if not record['exists'] or record.get('sha256') != expected[record['path']]]
          guard = {'state': 'INPUT/FAIL' if mismatches else 'FROZEN_INPUT_UNCHANGED',
                   'stage': os.environ['LOCK_STAGE'], 'expected': expected, 'observed': records}
          (out / 'input-admission.json').write_text(json.dumps(guard, indent=2) + '\n')
          if mismatches:
              raise RuntimeError('frozen S4 lock input changed; raw bytes retained: ' + json.dumps(mismatches))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: whole-app-format-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/whole-app-format
          if-no-files-found: error
  whole-shell-check:
    name: Required whole root and shell check, clippy and consumer tests
    needs: input-audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Preserve actual Cargo locks, input
        working-directory: source
        env:
          LOCK_STAGE: input
          LOCK_OUTPUT: ${{ runner.temp }}/whole-app-check/locks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['LOCK_OUTPUT']) / os.environ['LOCK_STAGE']
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for relative in ('crates/Cargo.lock', 'crates/shell/Cargo.lock'):
              source = pathlib.Path(relative)
              record = {'path': relative, 'exists': source.is_file()}
              if source.is_file():
                  data = source.read_bytes()
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'lock-receipt.json').write_text(json.dumps(records, indent=2) + '\n')
          expected = {
              'crates/Cargo.lock': '416faccdcdba0612e2b1b6833b09871fdc10102d4b0a35ec33bb12c87069bb04',
              'crates/shell/Cargo.lock': 'ce74057ae77a5f395fde10eeb21e99da434c3947282e67457634022e0b8db9b3'}
          mismatches = [record for record in records
                        if not record['exists'] or record.get('sha256') != expected[record['path']]]
          guard = {'state': 'INPUT/FAIL' if mismatches else 'FROZEN_INPUT_UNCHANGED',
                   'stage': os.environ['LOCK_STAGE'], 'expected': expected, 'observed': records}
          (out / 'input-admission.json').write_text(json.dumps(guard, indent=2) + '\n')
          if mismatches:
              raise RuntimeError('frozen S4 lock input changed; raw bytes retained: ' + json.dumps(mismatches))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          persist-credentials: false
      - name: Initialize honest execution states and bind checkout bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whole-app-check"
          printf 'INPUT/BLOCKED\ncompile=NOT_RUN\nconsumer=NOT_RUN\n' > "$RUNNER_TEMP/whole-app-check/status.txt"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          data = pathlib.Path('../definition/.github/validation/rust-first-app-integration-manifest.json').read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ['MANIFEST_SHA256']
          for entry in json.loads(data)['entries']:
              path = pathlib.Path(entry['path'])
              if entry['kind'] == 'delete':
                  assert not path.exists(), entry['path']
              else:
                  blob = path.read_bytes()
                  assert len(blob) == entry['size'] and hashlib.sha256(blob).hexdigest() == entry['sha256'], entry['path']
          PY
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: clippy
          targets: wasm32-wasip1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.nvmrc
      - name: npm ci, real workspace and preload dependencies
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-check/preparation/npm-ci"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          npm ci --ignore-scripts
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Complete pinned rhwp source and patch preparation
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-check/preparation/rhwp-source"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          node tools/build-rhwp-core.mjs --source-only
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Prepare pinned Tauri window lifetime source
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-check/preparation/tauri-source"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          bash crates/shell/ci/prepare-tauri-source.sh
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Frozen root and shell manifest preflight before CEF
        id: preflight
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'whole-app-check'
          records = []
          for label, relative in (('root', 'crates'), ('shell', 'crates/shell')):
              target = out / 'preflight' / label
              target.mkdir(parents=True, exist_ok=True)
              command = ['cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1']
              with (target / 'metadata.json').open('wb') as stdout, (target / 'metadata.stderr').open('wb') as stderr:
                  result = subprocess.run(command, cwd=relative, stdout=stdout, stderr=stderr)
              (target / 'status.txt').write_text(str(result.returncode) + '\n')
              records.append({'workspace': relative, 'command': command, 'returncode': result.returncode})
          failed = any(record['returncode'] != 0 for record in records)
          state = {'preflight': records, 'state': 'MANIFEST/INPUT/BLOCKED' if failed else 'FROZEN_INPUT_ACCEPTED',
                   'compile': 'NOT_RUN', 'consumerTests': 'NOT_RUN', 'appRuntime': 'NOT_RUN',
                   'nativeRestorationGrant': 'BLOCKED_NOT_IMPLEMENTED', 'nativeUi': 'BLOCKED', 'productGreen': False}
          (out / 'preflight-results.json').write_text(json.dumps(state, indent=2) + '\n')
          sys.exit(1 if failed else 0)
          PY
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: source/crates/shell
          cache-on-failure: true
      - name: CEF path
        run: echo "CEF_PATH=${USERPROFILE:-$HOME}/.cache/tauri-cef" >> "$GITHUB_ENV"
      - name: restore the CEF cache
        id: cef-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/tauri-cef
          key: shell-cef-${{ runner.os }}-${{ runner.arch }}-${{ env.CEF_CRATE_VERSION }}
      - name: tools
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-check/preparation/tools"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          cmake --version
          if ! ninja --version; then
            if [ '${{ matrix.platform }}' = mac ]; then brew install ninja; else choco install ninja -y; fi
          fi
          rustc --version
          cargo --version
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: document engine
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-check/preparation/wasm"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          npm run build:wasm
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: preloads
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-check/preparation/preloads"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          node crates/shell/bridge/preloads.mjs
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: engine host
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-check/preparation/engine-host"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          node crates/shell/engine-host/build.mjs
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: native helpers, macOS
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-check/preparation/native-mac"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          npm run native:build -w @seuoffice/sheets
          swiftc -O packages/pdf2docx/ocr-helper/vision-ocr.swift -o packages/pdf2docx/ocr-helper/vision-ocr
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: native helpers, Windows
        if: matrix.platform == 'win'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-check/preparation/native-win"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          npm run native:build -w @seuoffice/sheets
          node packages/pdf2docx/ocr-helper/build-win.mjs
          node apps/shell/src/main/quick-look/build-win.mjs
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Require actual prepared resources before compile
        run: |
          set -euo pipefail
          test -s crates/shell/frontend/index.html
          test -s crates/shell/out/preloads/manifest.json
          test -s crates/shell/out/engine-host/index.html
          test -s crates/shell/out/engine-host/docs-vendor/rhwp.wasm
          test -s crates/shell/out/engine-host/docs-vendor/office.wasm
          test -s crates/shell/out/engine-host/pdf/pdfium.wasm
          test -s crates/shell/out/engine-host/pdf/qpdf.wasm
          if [ '${{ matrix.platform }}' = mac ]; then
            test -s apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar
            test -s packages/pdf2docx/ocr-helper/vision-ocr
          else
            test -s apps/sheets/native/xlsx-engine/target/release/xlsx-sidecar.exe
            test -s packages/pdf2docx/ocr-helper/win-ocr.exe
            test -s apps/shell/src/main/quick-look/win-quicklook.exe
          fi
      - name: Actual whole root and shell check, clippy and consumer crate tests
        id: compile
        working-directory: source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/whole-app-check"
          python3 crates/shell/ci/cef-index-mirror.py 8099 "$CEF_VERSION" > "$out/cef-mirror.log" 2>&1 &
          mirror=$!
          trap 'kill "$mirror" 2>/dev/null || true' EXIT
          for _ in $(seq 1 90); do curl -sf http://127.0.0.1:8099/index.json -o /dev/null && break; sleep 1; done
          cat "$out/cef-mirror.log"
          export CEF_DOWNLOAD_URL=http://127.0.0.1:8099
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'whole-app-check'
          environment = os.environ.copy()
          test_data = out / 'consumer-test-userdata'
          test_data.mkdir(parents=True, exist_ok=True)
          environment['SEUOFFICE_USER_DATA'] = str(test_data)
          records = []
          runtime = {'platform': sys.platform, 'state': 'NOT_INSPECTED', 'paths': []}
          commands = [
              ('root-check', 'crates', ['cargo', 'check', '--locked', '--workspace', '--all-targets']),
              ('root-clippy', 'crates', ['cargo', 'clippy', '--locked', '--workspace', '--all-targets', '--', '-D', 'warnings']),
              ('shell-check', 'crates/shell', ['cargo', 'check', '--locked', '--all-targets']),
              ('shell-clippy', 'crates/shell', ['cargo', 'clippy', '--locked', '--all-targets', '--', '-D', 'warnings']),
              ('root-consumers', 'crates', ['cargo', 'test', '--locked', '--workspace', '--all-targets']),
              ('shell-consumers', 'crates/shell', ['cargo', 'test', '--locked', '--all-targets'])]
          for label, relative, command in commands:
              if label == 'shell-consumers':
                  roots = [pathlib.Path(os.environ['CEF_PATH']), pathlib.Path('crates/shell/target')]
                  if sys.platform == 'darwin':
                      paths = sorted({str(path.parent.resolve()) for root in roots if root.exists()
                                      for path in root.rglob('Chromium Embedded Framework.framework')})
                      if paths:
                          environment['DYLD_FRAMEWORK_PATH'] = os.pathsep.join(paths + [environment.get('DYLD_FRAMEWORK_PATH', '')])
                  elif sys.platform == 'win32':
                      paths = sorted({str(path.parent.resolve()) for root in roots if root.exists()
                                      for path in root.rglob('libcef.dll')})
                      if paths:
                          environment['PATH'] = os.pathsep.join(paths + [environment['PATH']])
                  else:
                      raise RuntimeError('whole shell consumer runner must be actual macOS or Windows')
                  runtime = {'platform': sys.platform, 'state': 'PRESENT' if paths else 'BLOCKED_MISSING_REAL_CEF', 'paths': paths}
                  (out / 'consumer-runtime.json').write_text(json.dumps(runtime, indent=2) + '\n')
              target = out / label
              target.mkdir(parents=True, exist_ok=True)
              with (target / 'stdout.log').open('wb') as stdout, (target / 'stderr.log').open('wb') as stderr:
                  result = subprocess.run(command, cwd=relative, env=environment, stdout=stdout, stderr=stderr)
              (target / 'status.txt').write_text(str(result.returncode) + '\n')
              records.append({'workspace': relative, 'command': command, 'returncode': result.returncode, 'label': label})
              print(label, result.returncode, flush=True)
          failed = any(record['returncode'] != 0 for record in records) or runtime['state'] != 'PRESENT'
          state = {'source': os.environ['SOURCE_SHA'], 'commands': records,
                   'crateGate': 'FAIL' if failed else 'CRATE_CHECK_CLIPPY_TESTS_PASS',
                   'consumerRuntime': runtime, 'appRuntime': 'NOT_RUN', 'package': 'NOT_RUN',
                   'nativeRestorationGrant': 'BLOCKED_NOT_IMPLEMENTED', 'nativeUi': 'BLOCKED', 'productGreen': False}
          (out / 'crate-consumer-results.json').write_text(json.dumps(state, indent=2) + '\n')
          sys.exit(1 if failed else 0)
          PY
      - name: Record non-executed compile honestly
        if: always() && steps.compile.outcome == 'skipped'
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/whole-app-check"
          if [ "$PREFLIGHT_OUTCOME" = failure ]; then
            printf 'MANIFEST/INPUT/BLOCKED\ncompile=NOT_RUN\nclippy=NOT_RUN\nconsumer=NOT_RUN\n' > "$RUNNER_TEMP/whole-app-check/status.txt"
          else
            printf 'PREPARATION/INPUT/BLOCKED\ncompile=NOT_RUN\nclippy=NOT_RUN\nconsumer=NOT_RUN\n' > "$RUNNER_TEMP/whole-app-check/status.txt"
          fi
      - name: save the CEF cache
        if: always() && steps.cef-cache.outcome == 'success' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/tauri-cef
          key: shell-cef-${{ runner.os }}-${{ runner.arch }}-${{ env.CEF_CRATE_VERSION }}
      - name: Preserve actual Cargo locks, after
        if: always()
        working-directory: source
        env:
          LOCK_STAGE: after
          LOCK_OUTPUT: ${{ runner.temp }}/whole-app-check/locks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['LOCK_OUTPUT']) / os.environ['LOCK_STAGE']
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for relative in ('crates/Cargo.lock', 'crates/shell/Cargo.lock'):
              source = pathlib.Path(relative)
              record = {'path': relative, 'exists': source.is_file()}
              if source.is_file():
                  data = source.read_bytes()
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'lock-receipt.json').write_text(json.dumps(records, indent=2) + '\n')
          expected = {
              'crates/Cargo.lock': '416faccdcdba0612e2b1b6833b09871fdc10102d4b0a35ec33bb12c87069bb04',
              'crates/shell/Cargo.lock': 'ce74057ae77a5f395fde10eeb21e99da434c3947282e67457634022e0b8db9b3'}
          mismatches = [record for record in records
                        if not record['exists'] or record.get('sha256') != expected[record['path']]]
          guard = {'state': 'INPUT/FAIL' if mismatches else 'FROZEN_INPUT_UNCHANGED',
                   'stage': os.environ['LOCK_STAGE'], 'expected': expected, 'observed': records}
          (out / 'input-admission.json').write_text(json.dumps(guard, indent=2) + '\n')
          if mismatches:
              raise RuntimeError('frozen S4 lock input changed; raw bytes retained: ' + json.dumps(mismatches))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: whole-app-check-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/whole-app-check
            source/crates/shell/out/preloads/manifest.json
          if-no-files-found: error
  genuine-policy:
    name: Required unchanged prepush, original full scope
    needs: input-audit
    strategy:
      fail-fast: false
      matrix:
        scope: [source, definition]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: definition
          fetch-depth: 6
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: source/.nvmrc
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Bind original criterion and initialize policy receipt
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whole-app-policy"
          printf 'PREPARATION/INPUT/BLOCKED\nprepush=NOT_RUN\nproductGreen=false\n' > "$RUNNER_TEMP/whole-app-policy/status.txt"
          test "$(git merge-base HEAD "$SOURCE_PARENT")" = "$SOURCE_PARENT"
          printf '%s  %s\n' 64c82ffe03995e6a518998c90ae354920473d48e0f35caaa01afadd5b938c4d6 tools/prepush.mjs | sha256sum -c -
          printf '%s  %s\n' 8ee967e10d3f848a3d68d1a22a5bef5220c1a2de02bac20fa5813f8b075aa2ee tools/build-rhwp-core.mjs | sha256sum -c -
          printf 'scope=%s\nhead=%s\npolicy_base=%s\n' '${{ matrix.scope }}' "$(git rev-parse HEAD)" "$SOURCE_PARENT" > "$RUNNER_TEMP/whole-app-policy/identity.txt"
      - name: Install exact actionlint for the canonical workflow check
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Preserve actual Cargo locks, input
        env:
          LOCK_STAGE: input
          LOCK_OUTPUT: ${{ runner.temp }}/whole-app-policy/locks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          out = pathlib.Path(os.environ['LOCK_OUTPUT']) / os.environ['LOCK_STAGE']
          out.mkdir(parents=True, exist_ok=True)
          records = []
          for relative in ('crates/Cargo.lock', 'crates/shell/Cargo.lock'):
              source = pathlib.Path(relative)
              record = {'path': relative, 'exists': source.is_file()}
              if source.is_file():
                  data = source.read_bytes()
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  record.update(size=len(data), sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
          (out / 'lock-receipt.json').write_text(json.dumps(records, indent=2) + '\n')
          expected = {
              'crates/Cargo.lock': '416faccdcdba0612e2b1b6833b09871fdc10102d4b0a35ec33bb12c87069bb04',
              'crates/shell/Cargo.lock': 'ce74057ae77a5f395fde10eeb21e99da434c3947282e67457634022e0b8db9b3'}
          mismatches = [record for record in records
                        if not record['exists'] or record.get('sha256') != expected[record['path']]]
          guard = {'state': 'INPUT/FAIL' if mismatches else 'FROZEN_INPUT_UNCHANGED',
                   'stage': os.environ['LOCK_STAGE'], 'expected': expected, 'observed': records}
          (out / 'input-admission.json').write_text(json.dumps(guard, indent=2) + '\n')
          if mismatches:
              raise RuntimeError('frozen S4 lock input changed; raw bytes retained: ' + json.dumps(mismatches))
          PY
      - name: Canonical full-scope prepush prerequisites
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/whole-app-policy/preparation/policy-prerequisites"
          mkdir -p "$log"
          status=0
          bash -e -o pipefail <<'PREPARATION_COMMAND' > "$log/stdout.log" 2> "$log/stderr.log" || status=$?
          set -euo pipefail
          npm ci --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/whole-app-policy/npm-ci.log"
          node tools/build-rhwp-core.mjs --source-only 2>&1 | tee "$RUNNER_TEMP/whole-app-policy/rhwp-source.log"
          test -f crates/.rhwp-source/v0.9.0/Cargo.toml
          test "$(git -C crates/.rhwp-source/v0.9.0 rev-parse HEAD)" = c9095c5f67632e6721e800ccc7fb43ea49d26682
          actionlint -version
          PREPARATION_COMMAND
          cat "$log/stdout.log" "$log/stderr.log"
          printf '%s\n' "$status" > "$log/status.txt"
          exit "$status"
      - name: Build the actual canonical WASM prerequisite for genuine prepush
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/whole-app-policy"
          status=0
          npm run build:wasm > "$out/build-wasm.stdout" 2> "$out/build-wasm.stderr" || status=$?
          cat "$out/build-wasm.stdout" "$out/build-wasm.stderr"
          printf '%s\n' "$status" > "$out/build-wasm-status.txt"
          exit "$status"
      - name: Run unchanged genuine prepush on the entire original delta
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/whole-app-policy"
          status=0
          node tools/prepush.mjs --base "$SOURCE_PARENT" > "$out/prepush.stdout" 2> "$out/prepush.stderr" || status=$?
          cat "$out/prepush.stdout" "$out/prepush.stderr"
          printf '%s\n' "$status" > "$out/prepush-status.txt"
          if [ "$status" -eq 0 ]; then
            printf 'POLICY/PASS\nproductGreen=false\nconsumer=NOT_RUN\n' > "$out/status.txt"
          else
            printf 'POLICY/FAIL\nproductGreen=false\nconsumer=NOT_RUN\n' > "$out/status.txt"
          fi
          exit "$status"
      - name: Preserve actual Cargo locks, after
        if: always()
        env:
          LOCK_STAGE: after
          LOCK_OUTPUT: ${{ runner.temp }}/whole-app-policy/locks
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
