[package]
name = "xlsx-sidecar"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
publish = false

[features]
# Run indexing and recalc inline instead of on threads, as WebAssembly builds
# without threads must; lets that path be tested on any machine.
single-thread = []

[dependencies]
base64 = "0.22.1"
calamine = "0.38.0"
cfb = "0.15"
ironcalc = "0.9.1"
quick-xml = { version = "0.38", features = ["encoding"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

# The browser build deflates its index's chunk files, which live in the page's
# memory there; already in the tree through zip's deflate
[target.'cfg(target_os = "wasi")'.dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
tempfile = "3"
