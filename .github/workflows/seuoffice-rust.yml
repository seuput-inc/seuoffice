name: seuoffice rust - missed sensitivity

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Exact followup product for the manifest's missed consumer boundaries
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: seuoffice-main-missed-sensitivity-${{ inputs.product_sha || github.ref }}
  cancel-in-progress: false

env:
  MODE: main-missed-sensitivity
  PRODUCT_DIR: ${{ github.workspace }}/product
  DRIVER_DIR: ${{ github.workspace }}/driver
  PRODUCT_SHA: ${{ inputs.product_sha }}
  DEFINITION_SHA: ${{ github.sha }}
  PLAN_PATH: ${{ github.workspace }}/missed-sensitivity-plan.json

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      product_sha: ${{ steps.identity.outputs.product_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact followup input
        id: identity
        run: node driver/tools/main-diff/missed-sensitivity-driver.mjs validate
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.product_sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Bind product lineage and original mutation objects
        id: plan
        run: node driver/tools/main-diff/missed-sensitivity-driver.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: missed-sensitivity-plan
          path: missed-sensitivity-plan.json
          if-no-files-found: error

  sensitivity:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TARGET_ID: ${{ matrix.targetId }}
      JOB_OUT: ${{ github.workspace }}/job-out
      MAIN_DIFF_OUT: ${{ github.workspace }}/job-out/mutant
      MAIN_DIFF_ADDON: ${{ github.workspace }}/job-out/main_node.node
      MAIN_DIFF_PROFILE: node-faults
      CARGO_INCREMENTAL: '1'
      SEUOFFICE_WASM: ${{ github.workspace }}/product/crates/target/wasm32-wasip1/release/office_wasm.wasm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.product_sha }}
          path: product
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: missed-sensitivity-plan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/crates
      - uses: actions/cache@v4
        id: rhwp-source
        with:
          path: product/crates/.rhwp-source
          key: rhwp-source-${{ hashFiles('product/vendor/rhwp-core/**', 'product/tools/build-rhwp-core.mjs') }}
      - name: Product rhwp source
        if: steps.rhwp-source.outputs.cache-hit != 'true'
        working-directory: product
        run: node tools/build-rhwp-core.mjs --source-only
      - name: Install exact product dependencies
        working-directory: product
        run: npm ci
      - name: Build exact product WASM
        working-directory: product
        run: npm run build:wasm
      - name: Normal selected consumer baseline
        id: baseline
        env:
          CARGO_INCREMENTAL: '1'
        run: node driver/tools/main-diff/missed-sensitivity-driver.mjs job-prepare
      - name: Original positive control and exact target residue
        id: mutations
        working-directory: product
        env:
          CARGO_INCREMENTAL: '1'
          FAULT_SHARD: ${{ steps.baseline.outputs.fault_shard }}
          FAULT_CATALOG: ${{ steps.baseline.outputs.catalog }}
        shell: bash
        run: node tools/main-diff/faults.mjs "$FAULT_CATALOG" 2>&1 | tee "$JOB_OUT/faults.txt"
      - name: Preserve raw producer evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$JOB_OUT"
          if [ -f product/tools/main-diff/out/faults.json ]; then
            cp product/tools/main-diff/out/faults.json "$JOB_OUT/faults.json"
          fi
          if [ -f "$MAIN_DIFF_OUT/report.json" ]; then
            cp "$MAIN_DIFF_OUT/report.json" "$JOB_OUT/terminal-report-raw.json"
          fi
      - name: Audit exact appended-case sensitivity and restoration
        if: ${{ success() }}
        env:
          CARGO_INCREMENTAL: '1'
          MUTATION_STATUS: ${{ steps.mutations.outcome }}
        run: node driver/tools/main-diff/missed-sensitivity-driver.mjs audit-job
      - name: Publish bounded target result or incomplete raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missed-sensitivity-${{ matrix.targetId }}
          path: |
            job-out
            !job-out/*.node
          if-no-files-found: error
