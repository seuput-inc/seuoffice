<!doctype html>
<html lang="ko">
  <meta charset="utf-8" />
  <title>시트 견본</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 12mm;
    }
    html,
    body {
      margin: 0;
      padding: 0;
    }
    body {
      font:
        9pt/1.3 'Malgun Gothic',
        'Apple SD Gothic Neo',
        'Noto Sans CJK KR',
        'Segoe UI',
        sans-serif;
    }
    .sheet {
      height: 4.2in;
      break-after: page;
      overflow: hidden;
    }
    .sheet:last-child {
      break-after: auto;
    }
    .marker {
      width: 36pt;
      height: 36pt;
      background: #000;
    }
    table {
      border-collapse: collapse;
      margin-top: 8pt;
      width: 100%;
    }
    td,
    th {
      border: 0.5pt solid #444;
      padding: 2pt 4pt;
    }
    th {
      background: #d1d5db;
    }
  </style>
  <body>
    <div class="sheet">
      <div class="marker"></div>
      <table>
        <tr>
          <th>항목</th>
          <th>수량</th>
          <th>단가</th>
          <th>금액</th>
          <th>비고</th>
        </tr>
        <tr>
          <td>연필</td>
          <td>10</td>
          <td>500</td>
          <td>5000</td>
          <td>Pencil</td>
        </tr>
        <tr>
          <td>공책</td>
          <td>4</td>
          <td>1200</td>
          <td>4800</td>
          <td>Notebook</td>
        </tr>
      </table>
    </div>
    <div class="sheet">
      <div class="marker"></div>
      <table>
        <tr>
          <th>항목</th>
          <th>수량</th>
          <th>단가</th>
          <th>금액</th>
          <th>비고</th>
        </tr>
        <tr>
          <td>지우개</td>
          <td>6</td>
          <td>300</td>
          <td>1800</td>
          <td>Eraser</td>
        </tr>
      </table>
    </div>
  </body>
  <script src="probe.js"></script>
  <script>
    P.log('p4.page', { page: 'sheets', pages: document.querySelectorAll('.sheet').length })
    P.done({ pages: 2 })
  </script>
</html>
